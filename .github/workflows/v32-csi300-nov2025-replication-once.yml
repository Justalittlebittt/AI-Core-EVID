name: V3.2 CSI300 Nov2025 20-session historical same-method replication once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-csi300-nov2025-replication-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install existing A-share source client
        run: python -m pip install --disable-pip-version-check 'baostock==0.9.4' 'numpy>=1.26,<3'
      - name: Apply preregistered 9-of-11 coverage gate to same 2025 event
        run: |
          python scripts/v32_csi300_nov2025_reconstitution_replicate_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/v32_csi300_reconstitution_202511_replication.json').read_text())
          assert x['original_count_per_group']==11
          assert x['groups']['ADD']['original_members']==11
          assert x['groups']['DELETE']['original_members']==11
          assert x['selected_after_seeing_may_2026_outcome_so_not_pristine_OOS'] is True
          assert x['trade_authorized'] is False
          print('FIXED_HISTORICAL_REPLICATION_NOT_PROSPECTIVE_ALPHA')
          PY
      - name: Keep original members, missingness and 20-session retrospective results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-csi300-2025-nov-11x2-20session-retrospective-replication
          path: /tmp/v32_csi300_reconstitution_202511_replication.json
          retention-days: 14
