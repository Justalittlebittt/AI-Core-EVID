name: V2.9.1 Negative Space Probe Phase A

on:
  push:
    branches: [main]
    paths:
      - "scripts/v291_negative_space_probe_phase_a.py"
      - ".github/workflows/v291-negative-space-phase-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transport dependency
        run: |
          pip install "playwright>=1.55"
          playwright install --with-deps chromium
      - name: Phase-A frozen-boundary and real blank-searchkey transport validation
        run: python scripts/v291_negative_space_probe_phase_a.py
      - name: Archive Phase-A receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v291-negative-space-phase-a
          if-no-files-found: warn
          retention-days: 30
          path: evidence/V2.9.1_NEGATIVE_SPACE_PROBE_PHASE_A_VALIDATION_1.json
