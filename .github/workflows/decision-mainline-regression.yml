name: Decision Mainline Regression
on:
  pull_request:
    paths:
      - '.github/workflows/decision-mainline-regression.yml'
      - 'scripts/v29_2025_filing_to_return_case.py'
      - 'scripts/test_v29_real_filing_decision_case.py'
      - 'scripts/v29_real_filing_decision_case.py'
      - 'scripts/test_v29_2025_filing_to_return_case.py'
      - 'research/V2.9_2025_TWO_ISSUER_FILING_INPUTS.json'
      - 'scripts/v29_historical_2022_25_source_pilot.py'
      - 'scripts/test_v29_historical_2022_25_source_pilot.py'
      - 'scripts/v29_growth_310_conditional_result.py'
      - 'scripts/test_v29_growth_310_conditional_result.py'
      - 'research/V2.9_GROWTH_310_CONDITIONAL_CONTROL_PREOUTCOME_20261102.json'
      - 'research/V2.9_GROWTH_310_PREOUTCOME_FINANCIAL_FRAME_20261102.csv'
      - 'research/V2.9_GROWTH_310_PREOUTCOME_SOURCE_RISK_FLAGS_20261102.csv'
      - 'scripts/v29_growth_forward_cohort.py'
      - 'scripts/test_v29_growth_forward_cohort.py'
      - 'research/V2.9_GROWTH_122_FORWARD_EVALUATION_PROTOCOL.json'
      - 'research/V2.9_GROWTH_122_ISSUER_COHORT_20261030.md'
      - 'scripts/v29_growth_core_earnings.py'
      - 'scripts/test_v29_growth_core_earnings.py'
      - 'scripts/v29_growth_raw_quality_audit.py'
      - 'scripts/test_v29_growth_raw_quality_audit.py'
      - 'scripts/v29_growth_market_context.py'
      - 'scripts/test_v29_growth_market_context.py'
      - 'scripts/v29_growth_persistence_review.py'
      - 'scripts/test_v29_growth_persistence_review.py'
      - 'scripts/v29_growth_candidate_snapshot.py'
      - 'scripts/v29_fy2026_next_vintage_selector.py'
      - 'scripts/test_v29_fy2026_next_vintage_selector.py'
      - 'scripts/v29_fy2026_full_source_frame.py'
      - 'scripts/test_v29_fy2026_full_source_frame.py'
      - 'scripts/v29_fy2026_capture_live.py'
      - 'scripts/test_v29_fy2026_capture_live.py'
      - 'research/V2.9_FY2026_NEW_VINTAGE_ADAPTED_GROWTH_PREOUTCOME_20261105.json'
      - 'scripts/test_v29_growth_candidate_snapshot.py'
      - 'scripts/v29_daily_review.py'
      - 'scripts/test_v29_daily_review.py'
      - 'scripts/v29_public_quote_watchlist.py'
      - 'scripts/test_v29_public_quote_watchlist.py'
      - 'scripts/v29_exit_execution_readiness.py'
      - 'scripts/test_v29_exit_execution_readiness.py'
      - 'scripts/v29_position_watchlist.py'
      - 'scripts/test_v29_position_watchlist.py'
      - 'scripts/v29_position_exit_review.py'
      - 'scripts/test_v29_position_exit_review.py'
      - 'scripts/v29_historical_asof_rank.py'
      - 'scripts/v29_historical_universe_sampling.py'
      - 'scripts/test_v29_historical_universe_sampling.py'
      - 'scripts/test_v29_historical_asof_rank.py'
      - 'scripts/v29_decision_case_demo.py'
      - 'scripts/v29_current_issuer_research_review.py'
      - 'scripts/v29_eight_portfolio_capacity.py'
      - 'scripts/test_v29_eight_portfolio_capacity.py'
      - 'scripts/v29_eight_pilot_outcome.py'
      - 'scripts/test_v29_eight_pilot_outcome.py'
      - 'scripts/test_v29_current_issuer_research_review.py'
      - 'scripts/v29_original_24_source_frame.py'
      - 'scripts/test_v29_original_24_source_frame.py'
      - 'research/v29_original_table_24_20261031/FIXED_24_ORIGINAL_YEAR_TABLE_FIELDS.json'
      - 'research/v29_original_table_24_20261031/PRECISION_RECONCILIATION.json'
      - 'research/V2.9_ISSUER_VALUATION_SENSITIVITY_20261030.json'
      - 'scripts/test_v29_decision_case_demo.py'
      - 'scripts/v29_historical_factor_admission.py'
      - 'scripts/test_v29_historical_factor_admission.py'
      - 'scripts/v29_decision_packet_adapter.py'
      - 'scripts/v29_discipline_engine.py'
      - 'scripts/v294_evidence_strength_synthesizer.py'
      - 'validation/v294_evidence_strength_synthesizer_selftest.py'
      - 'evidence/V2.8.1_FINAL_RECORD.json'
      - 'evidence/V2.8.1_STAGE1_FACTOR_SCREEN_RECEIPT.json'
  push:
    branches:
      - main
    paths:
      - 'scripts/v29_growth_310_conditional_result.py'
      - 'scripts/test_v29_growth_310_conditional_result.py'
      - 'scripts/v29_fy2026_next_vintage_selector.py'
      - 'scripts/test_v29_fy2026_next_vintage_selector.py'
      - 'scripts/v29_fy2026_full_source_frame.py'
      - 'scripts/test_v29_fy2026_full_source_frame.py'
      - 'scripts/v29_fy2026_capture_live.py'
      - 'scripts/test_v29_fy2026_capture_live.py'
      - 'research/V2.9_FY2026_NEW_VINTAGE_ADAPTED_GROWTH_PREOUTCOME_20261105.json'
      - '.github/workflows/decision-mainline-regression.yml'
      - 'scripts/v29_eight_portfolio_capacity.py'
      - 'scripts/test_v29_eight_portfolio_capacity.py'
      - 'scripts/v29_eight_pilot_outcome.py'
      - 'scripts/test_v29_eight_pilot_outcome.py'
  # One future financial reporting-vintage capture; retry bounded to May 1-5,
  # only before the next official trading open, and stop on first sealed source.
  schedule:
    - cron: '25 13 1-5 5 *'
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Execute decision mainline regressions
        run: |
          python -m unittest discover -s scripts -p 'test_v29_growth_candidate_snapshot.py' -v
          python -m unittest discover -s scripts -p 'test_v29_fy2026_next_vintage_selector.py' -v
          python -m unittest discover -s scripts -p 'test_v29_fy2026_full_source_frame.py' -v
          python -m unittest discover -s scripts -p 'test_v29_fy2026_capture_live.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_persistence_review.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_market_context.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_raw_quality_audit.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_core_earnings.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_forward_cohort.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_310_conditional_result.py' -v
          python -m unittest discover -s scripts -p 'test_v29_historical_2022_25_source_pilot.py' -v
          python -m unittest discover -s scripts -p 'test_v29_2025_filing_to_return_case.py' -v
          python -m unittest discover -s scripts -p 'test_v29_real_filing_decision_case.py' -v
          python scripts/v29_growth_forward_cohort.py > /tmp/v29-forward-readiness.json
          python -m unittest discover -s scripts -p 'test_v29_decision_case_demo.py' -v
          python -m unittest discover -s scripts -p 'test_v29_current_issuer_research_review.py' -v
          python -m unittest discover -s scripts -p 'test_v29_eight_portfolio_capacity.py' -v
          # Read-only real sealed entry; never sends orders or infers private account settings.
          python scripts/v29_eight_portfolio_capacity.py --sealed-readiness > /tmp/v29-eight-readiness.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v29-eight-readiness.json'))
          assert r['names']==8 and r['minimum_lot_gross_reference_cost_cny']==54558
          assert r['chinext_permission_needed_count']==3
          assert not r['trade_authorized'] and r['live_buy_eligibility']=='NOT_AUTHORIZED'
          print('REAL_SEALED_EIGHT_DECISION_READINESS',r['action_decision'],
                'MINIMUM_LOT_CNY',r['minimum_lot_gross_reference_cost_cny'],
                'CHINEXT_NAMES',r['chinext_permission_needed_count'])
          PY
          python -m unittest discover -s scripts -p 'test_v29_eight_pilot_outcome.py' -v
          python -m unittest discover -s scripts -p 'test_v29_original_24_source_frame.py' -v
          python scripts/v29_original_24_source_frame.py > /tmp/v29-original-24-source-frame.json
          python -m unittest discover -s scripts -p 'test_v29_historical_factor_admission.py' -v
          python -m unittest discover -s scripts -p 'test_v29_historical_asof_rank.py' -v
          python -m unittest discover -s scripts -p 'test_v29_historical_universe_sampling.py' -v
          python scripts/v29_historical_universe_sampling.py --out /tmp/v29-historical-source-frame.json
          python -m unittest discover -s scripts -p 'test_v29_position_exit_review.py' -v
          python -m unittest discover -s scripts -p 'test_v29_position_watchlist.py' -v
          python -m unittest discover -s scripts -p 'test_v29_exit_execution_readiness.py' -v
          python -m unittest discover -s scripts -p 'test_v29_public_quote_watchlist.py' -v
          python -m unittest discover -s scripts -p 'test_v29_daily_review.py' -v
          python scripts/v29_discipline_engine_selftest.py
          python scripts/v29_decision_packet_selftest.py
          python -m validation.v294_evidence_strength_synthesizer_selftest
      # Network provider availability is not part of deterministic mainline PR gating.
      - name: Execute demo and historical admission
        run: |
          python scripts/v29_decision_case_demo.py > /tmp/decision-demo.json
          python scripts/v29_current_issuer_research_review.py > /tmp/v29-actual-issuer-reviews.json
          python scripts/v29_historical_factor_admission.py > /tmp/admission.json
          python - <<'PY'
          import json
          with open("/tmp/decision-demo.json") as f: d=json.load(f)
          with open("/tmp/admission.json") as f: a=json.load(f)
          assert d["evaluation"]["discipline_decision"]["decision"] == "NO_ACTION_INSUFFICIENT_EVIDENCE"
          with open("/tmp/v29-original-24-source-frame.json") as f: frame=json.load(f)
          assert frame["frozen_issuer_year_count"] == 24
          assert frame["complete_four_field_count"] == 15 and frame["incomplete_four_field_count"] == 9
          assert frame["all_four_positive_descriptive_count"] == 3
          assert frame["vendor_2026_numeric_values_used_as_features"] is False
          assert frame["historical_pit_reconstruction_complete"] is False
          assert frame["live_buy_eligibility"] == "NOT_AUTHORIZED"
          with open("/tmp/v29-actual-issuer-reviews.json") as f: real=json.load(f)
          assert len(real["cases"]) == 2 and real["live_buy_eligibility"] == "NOT_AUTHORIZED"
          assert real["synthetic_risk_fields_used"] is False
          assert all(x["decision_packet"] is None and x["contemplated_action"] is None and not x["buy_add_authorized"] for x in real["cases"])
          assert a["factors_tested"] == 9 and a["factors_promoted"] == 0
          assert a["live_buy_eligibility"] == "NOT_AUTHORIZED"
          print("DECISION_MAINLINE_VERIFIED: 2 engines; no unsupported buys")
          PY

  fy2026-fresh-vintage-one-time-capture:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gate only predeclared 2027 annual source window before market open
        shell: bash
        id: gate
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Shanghai date +%F)"
          if [[ "$today" < "2027-05-01" || "$today" > "2027-05-05" ]]; then
            echo "FY2026_NEW_VINTAGE_OUTSIDE_DECLARED_SOURCE_WINDOW"
            exit 0
          fi
          out="research/V2.9_FY2026_NEW_VINTAGE_SOURCE_202705"
          if [ -f "$out/NORMALIZED_ALL_A_FRAME.json" ]; then
            echo "FY2026_NEW_VINTAGE_ALREADY_ARCHIVED"
            exit 0
          fi
          # Avoid permanently sealing May 1's incomplete provider cache
          # when later pre-open scheduled days can supply more FY2026 rows.
          python -m pip install --disable-pip-version-check baostock==0.9.4
          python scripts/v29_fy2026_capture_live.py --preflight > /tmp/v29-fy26-preflight.json
          cat /tmp/v29-fy26-preflight.json
          ready="$(python -c 'import json;print(int(json.load(open("/tmp/v29-fy26-preflight.json"))["capture_today"]))')"
          if [ "$ready" != "1" ]; then
            echo "SKIP_EARLY_SOURCE_WINDOW_WAIT_FOR_FINAL_PREOPEN_CAPTURE_DAY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Verify original pre-outcome candidate rule unchanged
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m unittest discover -s scripts -p 'test_v29_fy2026_next_vintage_selector.py' -v
          python -m unittest discover -s scripts -p 'test_v29_fy2026_full_source_frame.py' -v
          python -m unittest discover -s scripts -p 'test_v29_fy2026_capture_live.py' -v
      - name: Capture same-vintage free annual and Q3 source; finance-first quotes
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/v29_fy2026_capture_live.py --out-dir /tmp/v29-fy26-captured
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/v29-fy26-captured")
          frame=json.loads((root/"NORMALIZED_ALL_A_FRAME.json").read_text())
          assert frame["report_period"]=="2026-12-31"
          assert frame["comparison_period"]=="2026-09-30"
          assert len(frame["rows"])==frame["universe_source_count"]>0
          assert frame["live_buy_eligibility"]=="NOT_AUTHORIZED"
          provisional=root/"PROVISIONAL_EIGHT_RESEARCH_ONLY.json"
          frozen=root/"FROZEN_EIGHT_RESEARCH_ONLY.json"
          assert provisional.exists() != frozen.exists()
          result=json.loads((provisional if provisional.exists() else frozen).read_text())
          assert result["live_buy_eligibility"]=="NOT_AUTHORIZED"
          assert result["selected_count"] in (0,8)
          assert result["total_source_universe"]==frame["universe_source_count"]
          assert not result["strategy_validated"]
          if provisional.exists():
              assert result["calendar_pending_official_verification"]
              assert not result["all_selected_original_filings_verified"]
          print("FY2026_NEW_FINANCIAL_VINTAGE_RESEARCH_ONLY",
                "UNIVERSE",frame["universe_source_count"],
                "PREQUALIFIED",frame["preliminary_financial_qualification_count"],
                "SELECTED",result["selected_count"],"STATUS",result["status"])
          PY
      - name: Seal source receipts and candidate into existing GitHub repository
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          local_source="/tmp/v29-fy26-captured"
          target="research/V2.9_FY2026_NEW_VINTAGE_SOURCE_202705"
          # Retain every original page durably but avoid committing dozens of
          # uncompressed vendor JSON blobs and expanding history needlessly.
          tar -czf "$local_source/RAW_FINANCIAL_PAGES.tar.gz" -C "$local_source" \
            annual-summary q3-summary annual-core q3-core
          rm -rf "$local_source/annual-summary" "$local_source/q3-summary" \
                 "$local_source/annual-core" "$local_source/q3-core"
          if [ -e "$target/NORMALIZED_ALL_A_FRAME.json" ]; then
            echo "SEALED_FY2026_SOURCE_ALREADY_PRESENT"
            exit 0
          fi
          mkdir -p "$target"
          cp -a "$local_source/." "$target/"
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$target/"
          git commit -m "research(v29): seal FY2026 new-vintage A-share candidate evidence, NO BUY [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retain complete raw evidence if GitHub persistence is unavailable
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v29-fy2026-new-vintage-raw-and-provisional-candidates
          path: /tmp/v29-fy26-captured/
          if-no-files-found: warn
          retention-days: 30

  rescue-20261030-q3-filing-raw-once:
    # Preserve existing original 2026 Q3/F10 raw sources before Nov 13 expiry.
    # One-shot transfer; not a new data scrape and never a trading signal.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'RESCUE_20261030_Q3_RAW')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check original vendor source not already permanently archived
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f research/v29_2026q3_original_vendor_sources_20261030/SOURCE_VINTAGE_RECEIPT.json ]; then
            echo "ORIGINAL_2026_Q3_SOURCES_ALREADY_PRESERVED"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Download original growth report and 2026 Q3/H1 pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: growth-cutoff-20261029-observed-20261030
          run-id: 41010835022
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v29-raw-growth
      - name: Download original matched Q3/H1 F10 deducted profit sources
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: v29-310-core-profit-asof-20261029
          run-id: 41023214144
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v29-raw-core
      - name: Verify all original files and preserve source SHA256 receipt
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,tarfile
          from pathlib import Path
          target=Path("/tmp/v29-preserved-raw")
          target.mkdir(parents=True)
          source_specs=(
              ("growth",Path("/tmp/v29-raw-growth"),41010835022,12957159001,
               "99b5de995304f907e20a48bd0350ee1e046ba89cd031aef11d1910f7e14840fd"),
              ("core",Path("/tmp/v29-raw-core"),41023214144,12962712191,
               "0e0d4a9f36d7369c7dff76401aef06591663ecb24517896d4ee68bfd39d8a007"))
          receipt={"schema":"V29_20261030_ORIGINAL_VENDOR_Q3_AND_CORE_ARCHIVE_V1",
                   "acquired_on":"2026-10-30",
                   "disclosure_cutoff_exclusive":"2026-10-30",
                   "original_trading_alpha_or_BUY_eligibility":"NOT_AUTHORIZED",
                   "no_2027_restated_q3_replacement_implied":True,
                   "coverage_limited_to_original_vendor_asof_20261029":True,
                   "source_archives":[]}
          for name,source,run,artifact,digest in source_specs:
              files=sorted(p for p in source.rglob("*") if p.is_file())
              # Artifact two has a different internal directory layout.
              # Both original ZIPs were SHA256-verified by download-artifact.
              print("SOURCE_TREE",name,len(files),[p.relative_to(source).as_posix() for p in files[:8]])
              if len(files)<30:
                  raise ValueError("MISSING_ORIGINAL_"+name+"_EVIDENCE")
              sources=[]
              for p in files:
                  rel=p.relative_to(source).as_posix()
                  b=p.read_bytes()
                  if not b:
                      raise ValueError("EMPTY_ORIGINAL_EVIDENCE_FILE:"+rel)
                  sources.append({"path":rel,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)})
              out=target/(name+"_20261030_original_vendor_files.tar.gz")
              with tarfile.open(out,"w:gz") as z:
                  for p in files:
                      z.add(p,arcname=p.relative_to(source).as_posix(),recursive=False)
              receipt["source_archives"].append({
                  "source":name,"github_run_id":run,"artifact_id":artifact,
                  "original_artifact_zip_sha256_from_20261030_actions_log":digest,
                  "file_count":len(files),"files":sources,
                  "preserved_archive":out.name,
                  "preserved_archive_sha256":hashlib.sha256(out.read_bytes()).hexdigest()})
          (target/"SOURCE_VINTAGE_RECEIPT.json").write_text(
              json.dumps(receipt,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          assert len(receipt["source_archives"])==2
          print("OCT30_UNREVISED_Q3_SOURCE_VINTAGES_PRESERVED",
                [(x["source"],x["file_count"]) for x in receipt["source_archives"]])
          PY
      - name: Commit permanently without modifying frozen stock experiment
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="research/v29_2026q3_original_vendor_sources_20261030"
          test ! -e "$target/SOURCE_VINTAGE_RECEIPT.json"
          mkdir -p "$target"
          cp -a /tmp/v29-preserved-raw/. "$target/"
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$target/"
          git commit -m "research(v29): preserve 20261030 original Q3 and F10 source pages [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Keep emergency archive even if the repository push fails
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v29-original-20261030-q3-f10-emergency-archive
          path: /tmp/v29-preserved-raw
          if-no-files-found: warn
          retention-days: 30
