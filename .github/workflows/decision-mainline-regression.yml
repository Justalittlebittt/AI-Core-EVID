          else
            filename="OUTCOME_EIGHT.json"
            complete="ONE_NEW_ANNUAL_REPORT_VINTAGE_PAPER_EPISODE_ONLY"
            dest="research/V2.9_FY2026_NEW_VINTAGE_PAPER_OUTCOME"
          fi
          status="$(python - "$filename" <<'PY'
          import json,sys
