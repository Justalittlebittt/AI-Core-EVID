          assert d['live_buy_eligibility']=='NOT_AUTHORIZED'
          assert d['prior_factor_rv10_over_rv60_tested_again'] is False
          out=['# V3.1 2023—2024低绝对波动率假说：一次性历史实测','',
               '历史上固定两个独立年度的128股样本，仅按信号日前60日历史收益波动排序。',
               f"信号月：{d['requested_signal_months']}；覆盖充分月：{d['valid_descriptive_months']}；入选事件：{d['selected_event_count']}；实际取得收益代理：{d['selected_resolved_count']}。",
               f"预声明判定：{d['status']}。"]
          def pp(v):
              return '不可评估' if v is None else f'{100*v:+.3f}个百分点'
          out += [
             f"入选组合净收益与同期样本净收益的等月份差：{pp(d['primary_monthly_equal_weight_excess_selected_net_vs_sample_net'])}。",
             f"2023年度月度均值差：{pp(d['year_2023_and_2024_mean_excess']['2023'])}。",
             f"2024年度月度均值差：{pp(d['year_2023_and_2024_mean_excess']['2024'])}。",
             f"入选净收益减沪深300价格指数收益（次要）：{pp(d['secondary_mean_selected_net_minus_csi300_price'])}。",
             f"行情身份/交易日历/复权标记不一致的股票：{d['instrument_bar_integrity_error_count']}（仍保留原样本身份）。",
             '2026年事后取得的复权价格、未经认证的实际限价成交、缺少官方全收益基准；并非独立盲测。',
             '**NOT_AUTHORIZED / NO BUY。**']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as fh:fh.write('\n'.join(out)+'\n')
          (p/'SUMMARY.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('HISTORICAL_LOWVOL_RESULT',d['status'],'MONTHS',d['valid_descriptive_months'],
                'EXCESS',d['primary_monthly_equal_weight_excess_selected_net_vs_sample_net'])
          PY
      - name: Archive source and computed outcomes exactly once
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          dest="research/v31_2023_2024_lowvol_one_shot"
          test ! -f "$dest/RESULT.json"
          mkdir -p "$dest"
          cp /tmp/v31-historical-lowvol/RESULT.json "$dest/"
          cp /tmp/v31-historical-lowvol/SUMMARY.md "$dest/"
          cp /tmp/v31-historical-lowvol/RAW_BAOSTOCK_SOURCE.json.gz "$dest/"
          cp /tmp/v31-historical-lowvol/OBSERVATIONS.json.gz "$dest/"
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$dest"
          git commit -m "research(v31): seal 2023-24 lowvol retrospective result, no BUY [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve output if archival write fails
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v31-lowvol-2023-24-historical-test
          path: /tmp/v31-historical-lowvol/
          if-no-files-found: warn
          retention-days: 14

  v31-one-shot-eight-real-postclose:
    # Do not repeat an entire strategy/alpha backtest. Observe the 2026-11-10
    # closed session for only the frozen eight, with source proof and no BUY.
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'run(v31): verify real eight postclose') }}"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Never overwrite the sealed postclose sample
        id: gate
        run: |
          if test -e research/v31_20261110_eight_real_closed_session/RESULT.json; then
            echo "PRIOR_EOD_SOURCE_ALREADY_SAVED"
            exit 0
          fi
          echo 'execute=true' >> "$GITHUB_OUTPUT"
      - name: Retrieve eight free vendor EOD observations
        if: steps.gate.outputs.execute == 'true'
        run: |
          python -m pip install --disable-pip-version-check baostock==0.9.4
          python -m unittest discover -s scripts -p 'test_v31_eight_closed_session_execution_context.py' -v
          python scripts/v31_eight_closed_session_execution_context.py --out /tmp/v31-real-postclose
      - name: Check source seal and summarize verified observable execution constraints
        if: steps.gate.outputs.execute == 'true'
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os
          from pathlib import Path
          d=Path('/tmp/v31-real-postclose')
          r=json.loads((d/'RESULT.json').read_text())
          raw=gzip.decompress((d/'RAW_EIGHT_EOD_SOURCE.json.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()==r['original_raw_source_sha256']
          assert r['sample_count']==8
          assert not r['trade_authorized'] and r['live_buy_eligibility']=='NOT_AUTHORIZED'
          assert not r['buyer_side_order_limit_or_halt_tradability_certified']
          status={s:sum(x['status']==s for x in r['rows']) for s in sorted(set(x['status'] for x in r['rows']))}
          lines=[
              '# 2026-11-10 固定8股当日收盘行情与交易约束检查',
              '',
              '原策略没有独立预测优势证明，本报告不是买入单，不推断用户现金或账户权限。',
              f"第三方当日有价格且非ST、有成交量的股票：{r['nonst_positive_volume_quote_count']}/8。",
              f"最低一手收盘名义金额合计（仅8股全部有效时）：{r['basket_min_lot_eod_notional_cny_if_complete']}元。",
              '不同于11月2日历史价格及11月10日盘中参考价。BaoStock并非交易所成交认证。',
              '',
              '| 股票 | 收盘日期 | 当日收盘参考价 | 100股代理金额 | 市场状态 |',
              '|---|---|---:|---:|---|'
          ]
          for x in r['rows']:
              lines.append(f"| {x['security_id']} | {x['latest_vendor_bar_date'] or '缺失'} | {x['target_2026_11_10_eod_close_cny']} | {x['one_lot_eod_notional_cny']} | {x['status']} |")
          lines.extend(['',
              '**未认证：涨跌停盘口可成交性、真实交易成本、券商板块权限、私有资金及止损执行。**',
              '**NOT_AUTHORIZED / NO BUY。**'])
          (d/'SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          print('EIGHT_EOD_RESEARCH',status,'MIN_LOT',r['basket_min_lot_eod_notional_cny_if_complete'])
          PY
      - name: Save this actual observation and raw vendor bars
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          dest=research/v31_20261110_eight_real_closed_session
          test ! -e "$dest/RESULT.json"
          mkdir -p "$dest"
          cp /tmp/v31-real-postclose/RESULT.json /tmp/v31-real-postclose/SUMMARY.md /tmp/v31-real-postclose/RAW_EIGHT_EOD_SOURCE.json.gz "$dest/"
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$dest"
          git commit -m "research(v31): seal actual eight daily market status without buy [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fallback evidence artifact
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v31-real-eight-postclose
          path: /tmp/v31-real-postclose/
          if-no-files-found: warn
          retention-days: 14
