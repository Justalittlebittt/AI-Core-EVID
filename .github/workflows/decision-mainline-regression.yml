        run: |
          set -euo pipefail
          phase="${{ steps.phase_gate.outputs.phase }}"
          if [ "$phase" = "entry" ]; then
            filename="ENTRY_EIGHT.json"
            complete="PAPER_ENTRY_EIGHT_AND_H00300_COMPLETE"
