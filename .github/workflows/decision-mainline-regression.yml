name: Decision Mainline Regression
on:
  pull_request:
    paths:
      - '.github/workflows/decision-mainline-regression.yml'
      - 'scripts/v29_growth_market_context.py'
      - 'scripts/test_v29_growth_market_context.py'
      - 'scripts/v29_growth_persistence_review.py'
      - 'scripts/test_v29_growth_persistence_review.py'
      - 'scripts/v29_growth_candidate_snapshot.py'
      - 'scripts/test_v29_growth_candidate_snapshot.py'
      - 'scripts/v29_daily_review.py'
      - 'scripts/test_v29_daily_review.py'
      - 'scripts/v29_public_quote_watchlist.py'
      - 'scripts/test_v29_public_quote_watchlist.py'
      - 'scripts/v29_exit_execution_readiness.py'
      - 'scripts/test_v29_exit_execution_readiness.py'
      - 'scripts/v29_position_watchlist.py'
      - 'scripts/test_v29_position_watchlist.py'
      - 'scripts/v29_position_exit_review.py'
      - 'scripts/test_v29_position_exit_review.py'
      - 'scripts/v29_historical_asof_rank.py'
      - 'scripts/test_v29_historical_asof_rank.py'
      - 'scripts/v29_decision_case_demo.py'
      - 'scripts/test_v29_decision_case_demo.py'
      - 'scripts/v29_historical_factor_admission.py'
      - 'scripts/test_v29_historical_factor_admission.py'
      - 'scripts/v29_decision_packet_adapter.py'
      - 'scripts/v29_discipline_engine.py'
      - 'evidence/V2.8.1_FINAL_RECORD.json'
      - 'evidence/V2.8.1_STAGE1_FACTOR_SCREEN_RECEIPT.json'
permissions:
  contents: read
  actions: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Execute decision mainline regressions
        run: |
          python -m unittest discover -s scripts -p 'test_v29_growth_candidate_snapshot.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_persistence_review.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_market_context.py' -v
          python -m unittest discover -s scripts -p 'test_v29_decision_case_demo.py' -v
          python -m unittest discover -s scripts -p 'test_v29_historical_factor_admission.py' -v
          python -m unittest discover -s scripts -p 'test_v29_historical_asof_rank.py' -v
          python -m unittest discover -s scripts -p 'test_v29_position_exit_review.py' -v
          python -m unittest discover -s scripts -p 'test_v29_position_watchlist.py' -v
          python -m unittest discover -s scripts -p 'test_v29_exit_execution_readiness.py' -v
          python -m unittest discover -s scripts -p 'test_v29_public_quote_watchlist.py' -v
          python -m unittest discover -s scripts -p 'test_v29_daily_review.py' -v
          python scripts/v29_discipline_engine_selftest.py
          python scripts/v29_decision_packet_selftest.py
      # Network provider availability is not part of deterministic mainline PR gating.
      - name: Execute demo and historical admission
        run: |
          python scripts/v29_decision_case_demo.py > /tmp/decision-demo.json
          python scripts/v29_historical_factor_admission.py > /tmp/admission.json
          python - <<'PY'
          import json
          with open("/tmp/decision-demo.json") as f: d=json.load(f)
          with open("/tmp/admission.json") as f: a=json.load(f)
          assert d["evaluation"]["discipline_decision"]["decision"] == "NO_ACTION_INSUFFICIENT_EVIDENCE"
          assert a["factors_tested"] == 9 and a["factors_promoted"] == 0
          assert a["live_buy_eligibility"] == "NOT_AUTHORIZED"
          print("DECISION_MAINLINE_VERIFIED: 2 engines; no unsupported buys")
          PY




      - name: Temporary download previous financial capture
        uses: actions/download-artifact@v4
        with:
          name: growth-cutoff-20261029-observed-20261030
          repository: Justalittlebittt/AI-Core-EVID
          run-id: 41010835022
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v29-financial
      - name: Temporary real A-tier market valuation context
        timeout-minutes: 4
        run: |
          python scripts/v29_growth_market_context.py \
            --review-json "$RUNNER_TEMP/v29-financial/growth-cutoff-report.json" \
            --raw-dir "$RUNNER_TEMP/market-raw" \
            --output "$RUNNER_TEMP/market-output.json" \
            --queue-limit 12
      - name: Temporary preserve real market snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-growth-market-context-20261030
          path: |
            ${{ runner.temp }}/market-raw
            ${{ runner.temp }}/market-output.json
          if-no-files-found: ignore
          retention-days: 14
