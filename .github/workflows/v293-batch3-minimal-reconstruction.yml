name: V2.9.3 Minimal Batch-3 Reconstruction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v293-minimal-batch3-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-only dependencies
        run: |
          pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
          playwright install --with-deps chromium

      - name: Verify frozen V2.9.3 implementation binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/v293_batch3_chunk3_reconstruct.py)" = "dd655bffa989075cec5aa490344d7797c124156a"
          test "$(git hash-object scripts/v293_batch3_reconstruct_aggregate.py)" = "7bee071203302dd07136c737e733c70491e7a07f"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("evidence/V2.9.3_BATCH3_MINIMAL_RECONSTRUCTION_CONTRACT_1.json").read_text())
          assert c["status"]=="FROZEN_BEFORE_IMPLEMENTATION"
          assert c["exact_reconstruction_scope"]["scientific_batch_index"]==3
          assert c["exact_reconstruction_scope"]["batch_ranks"]==[145,146,147,148,149,150,151,152]
          assert c["immutable_reuse_chunks"]==[1,2,4,5,6,7,8]
          assert c["unchanged_science"]["fold3_forbidden"] is True
          assert c["unchanged_science"]["fold4_forbidden"] is True
          assert c["unchanged_science"]["price_or_return_forbidden"] is True
          assert c["governance"]["numeric_thresholds_changed"] is False
          assert c["governance"]["classifier_changed"] is False
          assert c["governance"]["triage_changed"] is False
          a=json.loads(Path("evidence/V2.9.3_REUSED_CHUNK_STATIC_AUDIT_1.json").read_text())
          assert a["status"]=="PASS"
          assert a["reused_chunks"]==[1,2,4,5,6,7,8]
          assert a["checks"]["all_receipts_complete"] is True
          assert a["checks"]["all_exact_rank_membership_match"] is True
          assert a["checks"]["all_exact_security_membership_match"] is True
          assert a["checks"]["all_result_payloads_present"] is True
          assert a["checks"]["all_prohibited_data_checks_clean"] is True
          PY

      - name: Verify repository-persisted prerequisite authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/v293_prerequisites/V2.9.1_COMPARISON_AUTHORITY_RECOVERY_RECEIPT_1.json | awk '{print $1}')" = "e4874bff18bdc9524687376714ea51132074265df8623b1d6f7bd91639f4e81f"
          test "$(sha256sum evidence/v293_prerequisites/V2.9.1_RECOVERED_PARENT_CANDIDATE_IDS_1.csv | awk '{print $1}')" = "4a620188902b38f12fcc1e45431cf2ea5ced55f32aab8844299cec3776c59a9c"
          test "$(sha256sum evidence/v293_prerequisites/V2.9.1_NEGATIVE_SPACE_PROBE_PHASE_A_VALIDATION_1.json | awk '{print $1}')" = "737612813f5358c3050a37a43b1592d3d48cbb11d4d752db3c00720e781580e7"
          test "$(sha256sum evidence/v293_prerequisites/V2.9_HISTORICAL_E_SOURCE_EXPANSION_FINAL_RECEIPT_1.json | awk '{print $1}')" = "ce27e03c93562508c93d24621637944670dcc0db3adb931046b7bff7e3780119"
          test "$(sha256sum evidence/v293_prerequisites/V2.9_HISTORICAL_E_SOURCE_EXPANSION_POSITIVE_EVENTS_1.csv | awk '{print $1}')" = "ea0631371002e3c29e61c04e39e8ce9d246a2fa3df9b135229f64653e23adc5b"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("evidence/V2.9.3_PERSISTED_PREREQUISITE_AUTHORITY_1.json").read_text())
          assert m["status"]=="FROZEN_REPOSITORY_PERSISTED_AUTHORITY"
          assert len(m["persisted_files"])==5
          assert m["governance"]["scientific_semantics_changed"] is False
          assert m["governance"]["classifier_changed"] is False
          assert m["governance"]["triage_changed"] is False
          assert m["governance"]["information_floor_changed"] is False
          PY

      - name: Reconstruct only Batch-3 chunk 3
        run: |
          python scripts/v293_batch3_chunk3_reconstruct.py \
            --authority evidence/v293_prerequisites/V2.9.1_RECOVERED_PARENT_CANDIDATE_IDS_1.csv \
            --recovery-receipt evidence/v293_prerequisites/V2.9.1_COMPARISON_AUTHORITY_RECOVERY_RECEIPT_1.json \
            --phase-a-receipt evidence/v293_prerequisites/V2.9.1_NEGATIVE_SPACE_PROBE_PHASE_A_VALIDATION_1.json

      - name: Persist reconstructed chunk-3 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for f in \
            evidence/V2.9.3_BATCH3_RECONSTRUCTION_CHUNK_03_RESULTS_1.csv \
            evidence/V2.9.3_BATCH3_RECONSTRUCTION_CHUNK_03_RECEIPT_1.json \
            evidence/V2.9.3_BATCH3_RECONSTRUCTION_CHUNK_03_PROGRESS_1.json; do
            [ -f "$f" ] && files+=("$f")
          done
          [ "${#files[@]}" -gt 0 ] || exit 0
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m "Persist V2.9.3 reconstructed Batch-3 chunk 3 evidence [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Aggregate reconstructed complete Batch-3
        if: success()
        run: |
          python scripts/v293_batch3_reconstruct_aggregate.py \
            --parent-positive-events evidence/v293_prerequisites/V2.9_HISTORICAL_E_SOURCE_EXPANSION_POSITIVE_EVENTS_1.csv \
            --parent-final-receipt evidence/v293_prerequisites/V2.9_HISTORICAL_E_SOURCE_EXPANSION_FINAL_RECEIPT_1.json

      - name: Persist V2.9.3 reconstructed Batch-3 terminal evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            evidence/V2.9.3_RECONSTRUCTED_BATCH3_RESULTS_1.csv \
            evidence/V2.9.3_RECONSTRUCTED_BATCH3_POSITIVE_EVENTS_1.csv \
            evidence/V2.9.3_HYBRID_DISCOVERY_UNION_POSITIVE_EVENTS_AFTER_RECONSTRUCTED_BATCH3_1.csv \
            evidence/V2.9.3_RECONSTRUCTED_BATCH3_RECEIPT_1.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist V2.9.3 reconstructed Batch-3 terminal evidence [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      # Best-effort terminal evidence when any earlier step fails or the job is cancelled.
      # This is an operational failure receipt, never a scientific PASS.
      - name: Record failed execution terminal
        if: ${{ always() && job.status != 'success' }}
        shell: bash
        env:
          V293_JOB_STATUS: ${{ job.status }}
          V293_RUN_ID: ${{ github.run_id }}
          V293_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/v293_batch3_failure_terminal.py \
            --job-status "$V293_JOB_STATUS" \
            --run-id "$V293_RUN_ID" \
            --run-attempt "$V293_RUN_ATTEMPT"
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/V2.9.3_BATCH3_EXECUTION_FAILURE_TERMINAL_1.json
          for f in \
            evidence/V2.9.3_BATCH3_RECONSTRUCTION_CHUNK_03_RESULTS_1.csv \
            evidence/V2.9.3_BATCH3_RECONSTRUCTION_CHUNK_03_RECEIPT_1.json \
            evidence/V2.9.3_BATCH3_RECONSTRUCTION_CHUNK_03_PROGRESS_1.json; do
            [ ! -f "$f" ] || git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Persist V2.9.3 Batch-3 execution failure terminal [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
