name: V2.8.5 Locked Backward Holdout Evaluation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v285-locked-holdout-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.3.2 pandas==2.3.2 pyarrow==21.0.0
      - name: Verify one-time holdout evaluation activation
        run: python scripts/v285_holdout_evaluation_gate.py
      - name: Locked evaluator self-test
        run: python scripts/v285_locked_holdout_evaluator.py self-test
      - name: Evaluate untouched frozen holdout
        run: python scripts/v285_locked_holdout_evaluator.py evaluate
      - name: Freeze terminal holdout result
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/V2.8.5_BACKWARD_HOLDOUT_DAILY_METRICS.csv
          if [ -f evidence/V2.8.5_BACKWARD_HOLDOUT_HYPOTHESIS_LEDGER.csv ]; then
            git add evidence/V2.8.5_BACKWARD_HOLDOUT_HYPOTHESIS_LEDGER.csv
          fi
          git add evidence/V2.8.5_BACKWARD_HOLDOUT_FINAL_RECEIPT.json
          git commit -m "Freeze V2.8.5 untouched backward-holdout result [skip ci]"
          git pull --rebase origin main
          git push
