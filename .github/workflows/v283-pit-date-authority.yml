name: V2.8.3 Prospective PIT Date Authority
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/v283-pit-date-authority.trigger"

permissions:
  contents: write

concurrency:
  group: v283-pit-date-authority
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2,<4" "requests>=2.32,<3" "openpyxl>=3.1,<4"
      - name: Resolve local signal date
        id: d
        shell: bash
        run: echo "signal_date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: Capture official PIT authority for D
        run: |
          python scripts/v283_pit_date_authority.py capture             --signal-date "${{ steps.d.outputs.signal_date }}"             --out evidence/v283_pit_authority
      - name: Freeze PIT authority if produced
        run: |
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A evidence/v283_pit_authority || true
          if git diff --cached --quiet; then
            echo "No PIT authority artifact produced for this date."
            exit 0
          fi
          git commit -m "Freeze V2.8.3 PIT authority ${{ steps.d.outputs.signal_date }} [skip ci]"
          git pull --rebase origin main
          git push
