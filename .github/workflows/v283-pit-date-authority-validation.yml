name: V2.8.3 PIT Date Authority Validation
on:
  push:
    paths:
      - "scripts/v283_pit_date_authority.py"
      - ".github/workflows/v283-pit-date-authority-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2,<4" "requests>=2.32,<3" "openpyxl>=3.1,<4"
      - name: Validate prospective PIT date authority runner
        run: python scripts/v283_pit_date_authority.py self-test
