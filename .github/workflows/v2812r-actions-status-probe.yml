name: V2.8.12R Actions Status Probe

on:
  push:
    branches:
      - main
    paths:
      - "evidence/V2.8.12R_ACTIONS_STATUS_PROBE_TRIGGER.json"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture R1 workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/retrospective_feasibility
          gh run list \
            --workflow v2812r-r1-real-expansion.yml \
            --limit 5 \
            --json databaseId,event,status,conclusion,headSha,createdAt,updatedAt,url \
            > evidence/retrospective_feasibility/V2.8.12R_R1_ACTIONS_STATUS_PROBE.json
      - name: Commit status probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/retrospective_feasibility/V2.8.12R_R1_ACTIONS_STATUS_PROBE.json
          git commit -m "Record V2.8.12R R1 Actions status probe [skip ci]"
          git pull --rebase origin main
          git push
