name: V2.8.12 Identity Completion Ratifier
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2812-identity-completion-ratifier.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v284-v2812-prospective-e-shadow-serial
  cancel-in-progress: false
jobs:
  validate-and-ratify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen ratifier implementation binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/v2812_identity_completion_ratifier.py)" = "34428efd7fc64541f17c83b6e6c4b00dd551e9de"
          test "$(git hash-object scripts/v2812_shadow_accumulator.py)" = "ccd2286013b0e4a8da5ff0ccbe09710a38658ebb"
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("evidence/V2.8.12_PROSPECTIVE_IDENTITY_COMPLETION_RATIFICATION_AMENDMENT_1.json").read_text())
          assert a["status"] in {"FROZEN_BEFORE_GENERIC_RATIFIER_IMPLEMENTATION","ACTIVE_VALIDATED_GENERIC_IDENTITY_COMPLETION_RATIFICATION"}
          assert a["governance"]["research_semantics_changed"] is False
          assert a["governance"]["classifier_changed"] is False
          assert a["governance"]["identity_rule_changed"] is False
          assert a["governance"]["effective_date_rule_changed"] is False
          assert a["governance"]["readiness_thresholds_changed"] is False
          assert a["governance"]["outcome_research_authorized"] is False
          assert a["governance"]["price_or_return_data_authorized"] is False
          assert a["governance"]["fold3_access"] is False
          assert a["governance"]["fold4_access"] is False
          PY
      - name: Generic ratifier self-test only
        run: python scripts/v2812_identity_completion_ratifier.py self-test
      - name: Ratify identity-complete prospective positives
        run: python scripts/v2812_identity_completion_ratifier.py ratify
      - name: Commit ratifications and shadow readiness if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/v2812_identity_ratifications evidence/V2.8.12_PROSPECTIVE_E_SHADOW_LEDGER.csv evidence/V2.8.12_SHADOW_INFORMATION_GATE_STATUS.json
          if git diff --cached --quiet; then
            echo "No new identity-completion ratification evidence"
            exit 0
          fi
          git commit -m "Ratify V2.8.12 prospective identity-complete filing events [skip ci]"
          git pull --rebase origin main
          git push
