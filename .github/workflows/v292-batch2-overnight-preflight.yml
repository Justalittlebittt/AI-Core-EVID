name: V2.9.2 Batch 2 Overnight Implementation Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v292-batch2-overnight-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install preflight dependencies
        run: pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
      - name: Syntax gate
        run: |
          python -m py_compile scripts/v292_hybrid_discovery_batch2_chunk.py
          python -m py_compile scripts/v292_hybrid_discovery_batch2_aggregate.py
      - name: Download prerequisite artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .v292/recovery .v292/phase_a .v292/parent
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11269201486/zip" -o .v292/recovery.zip
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11266397712/zip" -o .v292/phase_a.zip
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11213851477/zip" -o .v292/parent.zip
          test "$(sha256sum .v292/recovery.zip | awk '{print $1}')" = "653399dd8c4b428db583fad2bac9d1a943f446fafe6e29b8028f6a6fb53030e8"
          test "$(sha256sum .v292/parent.zip | awk '{print $1}')" = "17a7ee9d287b809165744a8966633f13ec0bf6d0094c09b35d2f335f46a82a72"
          unzip -q .v292/recovery.zip -d .v292/recovery
          unzip -q .v292/phase_a.zip -d .v292/phase_a
          unzip -q .v292/parent.zip -d .v292/parent
          test "$(find .v292/parent -type f -name 'V2.9_HISTORICAL_E_SOURCE_EXPANSION_POSITIVE_EVENTS_1.csv' | wc -l)" -eq 1
          test "$(find .v292/parent -type f -name 'V2.9_HISTORICAL_E_SOURCE_EXPANSION_FINAL_RECEIPT_1.json' | wc -l)" -eq 1
      - name: Deterministic membership and authority gate
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("m","scripts/v292_hybrid_discovery_batch2_chunk.py")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          c,parent,owner,batch,imap,fb=m.load_batch_and_identity(
            ".v292/recovery/V2.9.1_RECOVERED_PARENT_CANDIDATE_IDS_1.csv",
            ".v292/recovery/V2.9.1_COMPARISON_AUTHORITY_RECOVERY_RECEIPT_1.json",
            ".v292/phase_a/V2.9.1_NEGATIVE_SPACE_PROBE_PHASE_A_VALIDATION_1.json")
          assert len(batch)==64
          assert set(fb)=={"SSE:600608","SZSE:300280"}
          assert all(x in imap or x in fb for x in batch)
          print("V2.9.2 Batch-2 implementation preflight PASS")
          PY
