name: V2.9 Original FY2024 Issuer PDF Binary Evidence
on:
  pull_request:
    paths:
      - '.github/workflows/v29-original-filing-proof.yml'
      - 'scripts/v29_original_filing_pdf_proof.py'
      - 'scripts/test_v29_original_filing_pdf_proof.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v29-original-filing-proof.yml'
      - 'scripts/v29_original_filing_pdf_proof.py'
permissions:
  contents: read

jobs:
  original-document-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install free PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Check frozen issuer/sample identities and reject fake PDF sources
        run: |
          python -m unittest discover -s scripts -p 'test_v29_original_filing_pdf_proof.py' -v
      - name: Diagnose real original PDF text extraction without persisting the PDFs
        run: |
          python scripts/v29_original_filing_pdf_proof.py --out /tmp/v29-original-pdf-diag

  first-two-original-pdfs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install free PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Validate original report identities without source network
        run: python -m unittest discover -s scripts -p 'test_v29_original_filing_pdf_proof.py' -v
      - name: Download original full report PDFs and seal actual bytes in research evidence
        run: |
          python scripts/v29_original_filing_pdf_proof.py --out evidence/v29_original_2025_fy2024_reports
          python - <<'PY'
          import json
          p="evidence/v29_original_2025_fy2024_reports/BINARY_SOURCE_MANIFEST.json"
          x=json.load(open(p))
          assert x["sample_count"]==128
          assert x["live_buy_eligibility"]=="NOT_AUTHORIZED"
          assert x["full_128_original_report_complete"] is False
          assert x["original_full_pdf_verified"]>=1
          print("DURABLY_SEALING_PDF_COUNT",x["original_full_pdf_verified"])
          print("NUMERIC_TEXT_MATCH_COUNT",x["field_numeric_text_present"])
          print("PIT_UNCERTIFIED_AND_NO_OOS_OR_BUY")
          PY
      - name: Commit original binary PDFs and source manifest, not ephemeral links
        run: |
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/v29_original_2025_fy2024_reports/
          git diff --cached --quiet || (git commit -m "research(v29): persist original FY2024 report PDF bytes and SHA evidence [skip ci]" && git push origin HEAD:main)
      - name: Preserve diagnostic evidence even if source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-original-fy2024-issuer-pdf-proof
          path: evidence/v29_original_2025_fy2024_reports/
          if-no-files-found: warn
          retention-days: 14
