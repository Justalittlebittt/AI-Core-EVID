name: V2.8.12R R1 Technical Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "evidence/V2.8.12R_R1_TECHNICAL_REPAIR_ACTIVATION.json"

permissions:
  contents: write

concurrency:
  group: v2812r-r1-technical-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen R1 repair runtime
        run: python -m pip install playwright==1.55.0 pymupdf==1.26.4 pandas==2.3.2
      - name: Run exact bounded R1 repair targets
        env:
          PYTHONPATH: scripts
        run: python scripts/v2812r_r1_technical_repair.py
      - name: Freeze append-only R1 repair evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/retrospective_feasibility/V2.8.12R_R1_TECHNICAL_REPAIR_RESULTS.csv
          git add evidence/retrospective_feasibility/V2.8.12R_R1_TECHNICAL_REPAIR_RECEIPT.json
          git commit -m "Freeze V2.8.12R R1 bounded technical repair evidence [skip ci]"
          git pull --rebase origin main
          git push
