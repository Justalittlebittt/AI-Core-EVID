name: V2.8.12R R2 Outcome-Blind Source Coverage Preflight

# Existing preflight rerun after the final pre-outcome cohort was actually frozen.
on:
  push:
    branches:
      - main
    paths:
      - "evidence/retrospective_feasibility/V2.8.12R_FINAL_PRE_OUTCOME_COHORT_RECEIPT.json"
      - "evidence/retrospective_feasibility/V2.8.12R_R1_TECHNICAL_GATE_RECONCILED_RECEIPT.json"
      - ".github/workflows/v2812r-r2-source-coverage-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2812r-r2-source-coverage-preflight
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile coverage-only probe
        run: python -m py_compile scripts/v2812r_r2_source_coverage_preflight.py scripts/v2812r_r2_source_coverage_preflight_reconciled.py
      - name: Install exact-source coverage runtime
        run: python -m pip install duckdb==1.4.1 pandas==2.3.2 huggingface_hub==0.35.3
      - name: Verify coverage-only authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/V2.8.12R_RETROSPECTIVE_FEASIBILITY_CONTRACT_AMENDMENT_4.json').read_text())
          r=json.loads(Path('evidence/retrospective_feasibility/V2.8.12R_R1_TECHNICAL_GATE_RECONCILED_RECEIPT.json').read_text())
          i=json.loads(Path('evidence/retrospective_feasibility/V2.8.12R_R1_TECHNICAL_GATE_RECEIPT.json').read_text())
          c=json.loads(Path('evidence/retrospective_feasibility/V2.8.12R_FINAL_PRE_OUTCOME_COHORT_RECEIPT.json').read_text())
          assert a['status']=='ACTIVE_PRE_OUTCOME_SOURCE_COVERAGE_PREFLIGHT'
          assert a['authorization_boundary']['price_values_may_be_read_or_logged'] is False
          assert a['authorization_boundary']['returns_may_be_computed'] is False
          assert a['governance']['outcome_resolution_authorized_by_this_amendment'] is False
          assert r['status']=='R1_COHORT_TECHNICALLY_COMPLETE'
          assert r['R2_price_or_return_access_authorized'] is True
          assert r['reconciliation_basis']['original_gate_receipt_preserved'] is True
          assert i['status']=='R1_TECHNICAL_INCOMPLETE_R2_OUTCOME_ACCESS_BLOCKED'
          assert i['R2_price_or_return_access_authorized'] is False
          assert c['status']=='PASS_FINAL_PRE_OUTCOME_COHORT_FROZEN'
          assert c['price_or_return_data_consumed'] is False
          print('V2.8.12R reconciled coverage-only authorization PASS')
          PY
      - name: Run exact-revision symbol/date coverage preflight only
        env:
          PYTHONPATH: scripts
        run: python scripts/v2812r_r2_source_coverage_preflight_reconciled.py
      - name: Freeze source coverage receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/retrospective_feasibility/V2.8.12R_R2_SOURCE_COVERAGE_PREFLIGHT_RECEIPT.json
          git commit -m "Freeze V2.8.12R R2 source coverage preflight [skip ci]"
          git pull --rebase origin main
          git push
