name: V2.7.24 Real Mother Pool Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_real_mother_pool_v2724.py"
      - "requirements.txt"
      - ".github/workflows/real-mother-pool.yml"

permissions:
  contents: read

jobs:
  real-mother-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute frozen V2.7.24 gate
        run: |
          python scripts/run_real_mother_pool_v2724.py | tee v2724_run.log

      - name: Add execution log
        if: always()
        run: |
          mkdir -p artifacts
          cp v2724_run.log artifacts/V2724_RUN_LOG.txt || true

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_CORE_EVID_V2.7.24_REAL_MOTHER_POOL
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
