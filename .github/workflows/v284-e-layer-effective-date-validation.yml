name: V2.8.4 E-Layer Effective Date Validation
on:
  push:
    paths:
      - "scripts/v284_e_layer_effective_date.py"
      - ".github/workflows/v284-e-layer-effective-date-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/v284_e_layer_effective_date.py self-test
