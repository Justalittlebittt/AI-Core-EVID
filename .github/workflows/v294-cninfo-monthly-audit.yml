name: 002667 Frozen Triage Title Input Audit
on:
  push:
    branches: [fix/v293-batch3-failure-terminal-evidence]
    paths: [.github/v294-monthly-audit/launch.txt]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
          playwright install --with-deps chromium
      - name: Frozen title triage input equivalence contract tests
        run: python -m unittest discover -s scripts -p 'test_v294_szse_title_triage_input_equivalence.py' -v
      - name: Read-only 486-title frozen triage input comparison
        run: python scripts/v294_szse_title_triage_input_equivalence.py
      - name: Persist audit, including failure evidence if produced
        if: always()
        run: |
          if test -f evidence/V2.9.4_002667_FROZEN_TRIAGE_TITLE_INPUT_EQUIVALENCE_1.json; then
            git config user.name ai-core-evid-bot
            git config user.email actions@users.noreply.github.com
            git add evidence/V2.9.4_002667_FROZEN_TRIAGE_TITLE_INPUT_EQUIVALENCE_1.json
            git diff --cached --quiet || (git commit -m "Persist SZSE title-input frozen triage comparison [skip ci]" && git pull --rebase && git push)
          fi
