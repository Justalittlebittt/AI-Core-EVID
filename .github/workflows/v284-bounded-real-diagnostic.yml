name: V2.8.4 Bounded Real Evidence Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
      - name: Synthetic selection self-test
        run: python scripts/v284_bounded_real_diagnostic.py self-test
      - name: Run bounded real diagnostic
        run: python scripts/v284_bounded_real_diagnostic.py run --out v284_real_diagnostic
      - name: Freeze compact diagnostic evidence
        run: |
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p evidence/v284_real_diagnostic
          cp v284_real_diagnostic/V2.8.4_BOUNDED_REAL_DIAGNOSTIC_RESULTS.csv evidence/v284_real_diagnostic/
          cp v284_real_diagnostic/V2.8.4_BOUNDED_REAL_DIAGNOSTIC_RECEIPT.json evidence/v284_real_diagnostic/
          git add evidence/v284_real_diagnostic/
          git commit -m "Freeze V2.8.4 bounded real evidence diagnostic [skip ci]"
          git pull --rebase origin main
          git push
