name: CNINFO 002667 Pagination Read-Only Diagnostic
on:
  push:
    branches: [fix/v293-batch3-failure-terminal-evidence]
    paths: [.github/v294-pagination-diagnostic/launch.txt]
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install "playwright>=1.55"
          playwright install --with-deps chromium
      - name: Run read-only diagnostic
        run: python scripts/v294_cninfo_pagination_diagnostic.py
      - name: Persist diagnostic evidence
        if: always()
        run: |
          if test -f evidence/V2.9.4_CNINFO_002667_PAGINATION_DIAGNOSTIC_1.json; then
            git config user.name ai-core-evid-bot
            git config user.email actions@users.noreply.github.com
            git add evidence/V2.9.4_CNINFO_002667_PAGINATION_DIAGNOSTIC_1.json
            git diff --cached --quiet || (git commit -m "Record read-only CNINFO pagination diagnostic [skip ci]" && git pull --rebase && git push)
          fi
