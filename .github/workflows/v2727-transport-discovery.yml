name: V2.7.27 Filing Transport Discovery
on:
  push:
    branches: [main]
    paths:
      - "scripts/v2727_transport_discovery.py"
      - ".github/workflows/v2727-transport-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install "playwright>=1.55"
          python -m playwright install --with-deps chromium
      - name: Discover official filing transports
        run: python scripts/v2727_transport_discovery.py | tee v2727_transport.log
      - if: always()
        run: |
          mkdir -p v2727_transport_artifacts
          cp v2727_transport.log v2727_transport_artifacts/V2727_TRANSPORT_LOG.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_CORE_EVID_V2.7.27_TRANSPORT_DISCOVERY
          path: v2727_transport_artifacts/
          if-no-files-found: error
          retention-days: 30
