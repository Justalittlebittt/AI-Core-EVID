name: A-share Risk MVP Regression
on:
  pull_request:
    paths:
      - 'scripts/ashare_market_risk_*.py'
      - 'validation/ashare_market_risk_*.py'
      - 'validation/ashare_snapshot_provenance_audit.py'
      - 'validation/test_ashare_snapshot_provenance_audit.py'
      - '.github/workflows/ashare-risk-regression.yml'
  push:
    branches:
      - feature/a-share-mainline-recovery-20261011
    paths:
      - 'scripts/ashare_market_risk_*.py'
      - 'validation/ashare_market_risk_*.py'
      - 'validation/ashare_snapshot_provenance_audit.py'
      - 'validation/test_ashare_snapshot_provenance_audit.py'
      - '.github/workflows/ashare-risk-regression.yml'
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax checks
        run: |
          python -m py_compile scripts/ashare_market_risk_akshare_fetch.py scripts/ashare_market_risk_descriptive.py validation/ashare_market_risk_akshare_fetch_selftest.py validation/ashare_market_risk_descriptive_selftest.py validation/ashare_market_risk_real_snapshot_acceptance.py validation/ashare_market_risk_real_snapshot_acceptance_selftest.py validation/ashare_snapshot_provenance_audit.py validation/test_ashare_snapshot_provenance_audit.py
      - name: Adapter mocked source regression
        run: python validation/ashare_market_risk_akshare_fetch_selftest.py
      - name: Historical descriptive synthetic mechanics
        run: python validation/ashare_market_risk_descriptive_selftest.py
      - name: Snapshot acceptance positive and negative synthetic regressions
        env:
          PYTHONPATH: scripts:validation
        run: python validation/ashare_market_risk_real_snapshot_acceptance_selftest.py
      - name: Snapshot manifest provenance regression
        env:
          PYTHONPATH: validation
        run: python -m unittest -v test_ashare_snapshot_provenance_audit
