name: V2.8.12 Shadow Accumulator Self-Test
on:
  push:
    paths:
      - ".github/workflows/v2812-shadow-accumulator-selftest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify accumulator, strict identity prebinder, ratifier and active daily workflow binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/v2812_shadow_accumulator.py)" = "ccd2286013b0e4a8da5ff0ccbe09710a38658ebb"
          test "$(git hash-object scripts/v2812_strict_title_identity_prebinder.py)" = "0d30473ae007fd9fa6a3818f3add87c4a37bae38"
          test "$(git hash-object scripts/v2812_identity_completion_ratifier.py)" = "226fe586f1325e1753d95303ff021b01481c10ed"
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("evidence/V2.8.12_SHADOW_ACCUMULATOR_INTEGRITY_AMENDMENT_1.json").read_text())
          pb=json.loads(Path("evidence/V2.8.12_STRICT_TITLE_IDENTITY_PREBINDING_AMENDMENT_1.json").read_text())
          pbv=json.loads(Path("evidence/V2.8.12_STRICT_TITLE_IDENTITY_PREBINDER_VALIDATION_RECEIPT.json").read_text())
          ir=json.loads(Path("evidence/V2.8.12_PROSPECTIVE_IDENTITY_COMPLETION_RATIFICATION_AMENDMENT_1.json").read_text())
          irv=json.loads(Path("evidence/V2.8.12_IDENTITY_COMPLETION_RATIFIER_VALIDATION_RECEIPT.json").read_text())
          w=Path(".github/workflows/v284-controlled-prospective-e-layer.yml").read_text()

          assert a["schema"]=="AI_CORE_EVID_V2_8_12_SHADOW_ACCUMULATOR_INTEGRITY_AMENDMENT_V1"
          assert a["historical_validation"]["historical_validated_blob_sha"]=="66fe3735c512e09252ee2400e458334a4043536b"
          assert a["historical_validation"]["preserved_unchanged"] is True
          assert a["correction"]["corrected_accumulator_blob_sha"]=="ccd2286013b0e4a8da5ff0ccbe09710a38658ebb"
          assert a["correction"]["readiness_thresholds_changed"] is False
          assert a["governance"]["research_semantics_changed"] is False

          assert pb["status"]=="ACTIVE_VALIDATED_STRICT_TITLE_IDENTITY_PREBINDING"
          assert pb["implementation_validation"]["blob_sha"]=="0d30473ae007fd9fa6a3818f3add87c4a37bae38"
          assert pb["implementation_validation"]["selftest"]=="13/13 PASS"
          assert pb["strict_derivation_rule"]["unique_derived_legal_name_required"] is True
          assert pb["strict_derivation_rule"]["issuer_authored_title_required"] is True
          assert pb["strict_derivation_rule"]["third_party_title_alone_sufficient"] is False
          assert pb["governance"]["fuzzy_identity_inference_authorized"] is False
          assert pb["governance"]["outcome_research_authorized"] is False
          assert pb["governance"]["price_or_return_data_authorized"] is False
          assert pbv["status"]=="PASS"
          assert pbv["implementation"]["blob_sha"]=="0d30473ae007fd9fa6a3818f3add87c4a37bae38"
          assert pbv["validated_scope"]["binding_commit_required_before_ratifier"] is True

          assert ir["status"]=="ACTIVE_VALIDATED_GENERIC_IDENTITY_COMPLETION_RATIFICATION"
          assert ir["implementation_validation"]["ratifier_blob_sha"]=="226fe586f1325e1753d95303ff021b01481c10ed"
          assert ir["implementation_validation"]["selftest"]=="13/13 PASS"
          assert ir["governance"]["research_semantics_changed"] is False
          assert ir["governance"]["outcome_research_authorized"] is False
          assert irv["status"]=="PASS"
          assert irv["implementation"]["blob_sha"]=="226fe586f1325e1753d95303ff021b01481c10ed"
          assert irv["validation_sequence"]["stable_idempotence_run"]["appended"]==0
          assert irv["validation_sequence"]["stable_idempotence_run"]["duplicate_noops"]==2

          accumulator_pin='test "$(git hash-object scripts/v2812_shadow_accumulator.py)" = "ccd2286013b0e4a8da5ff0ccbe09710a38658ebb"'
          prebinder_pin='test "$(git hash-object scripts/v2812_strict_title_identity_prebinder.py)" = "0d30473ae007fd9fa6a3818f3add87c4a37bae38"'
          ratifier_pin='test "$(git hash-object scripts/v2812_identity_completion_ratifier.py)" = "226fe586f1325e1753d95303ff021b01481c10ed"'
          prebinder_call='python scripts/v2812_strict_title_identity_prebinder.py bind'
          accumulator_call='python scripts/v2812_shadow_accumulator.py accumulate'
          ratifier_call='python scripts/v2812_identity_completion_ratifier.py ratify'
          binding_csv_stage='git add evidence/V2.8.4_E_LAYER_ISSUER_IDENTITY_BINDINGS.csv'
          binding_dir_guard='if test -d evidence/v2812_identity_bindings; then'
          binding_receipt_stage='git add evidence/v2812_identity_bindings'
          binding_commit='git commit -m "Bind V2.8.12 strict prospective issuer identities [skip ci]"'

          assert accumulator_pin in w
          assert prebinder_pin in w
          assert ratifier_pin in w
          assert w.count(prebinder_call)==1
          assert w.count(accumulator_call)==1
          assert w.count(ratifier_call)==1
          assert binding_csv_stage in w
          assert binding_dir_guard in w
          assert binding_receipt_stage in w
          assert 'git add evidence/V2.8.4_E_LAYER_ISSUER_IDENTITY_BINDINGS.csv evidence/v2812_identity_bindings' not in w
          assert binding_commit in w
          assert 'V2.8.12_STRICT_TITLE_IDENTITY_PREBINDING_AMENDMENT_1.json' in w
          assert 'V2.8.12_STRICT_TITLE_IDENTITY_PREBINDER_VALIDATION_RECEIPT.json' in w
          assert 'evidence/v2812_identity_ratifications' in w
          assert w.index(prebinder_call) < w.index(binding_csv_stage) < w.index(binding_dir_guard) < w.index(binding_commit) < w.index(ratifier_call)
          assert w.index(binding_commit) < w.index(accumulator_call) < w.index(ratifier_call)
          print("V2.8.12 strict prebinder -> guarded no-op-safe binding staging -> authoritative binding commit -> accumulator -> ratifier PASS")
          PY
      - name: Exercise current empty strict-binding staging path
        shell: bash
        run: |
          set -euo pipefail
          git add evidence/V2.8.4_E_LAYER_ISSUER_IDENTITY_BINDINGS.csv
          if test -d evidence/v2812_identity_bindings; then
            git add evidence/v2812_identity_bindings
          fi
          git diff --cached --quiet
          echo "V2.8.12 strict identity empty-staging no-op PASS"
      - name: Run V2.8.12 shadow accumulator self-test
        run: python scripts/v2812_shadow_accumulator.py self-test
      - name: Run V2.8.12 strict-title identity prebinder self-test
        run: python scripts/v2812_strict_title_identity_prebinder.py self-test
      - name: Run V2.8.12 identity completion ratifier self-test
        run: python scripts/v2812_identity_completion_ratifier.py self-test
