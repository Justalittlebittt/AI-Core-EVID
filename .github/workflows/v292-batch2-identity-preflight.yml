name: V2.9.2 Batch 2 Identity Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v292-batch2-identity-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
      - name: Preflight syntax
        run: python -m py_compile scripts/v292_batch2_identity_preflight.py
      - name: Validate Batch-2 identity authority
        run: python scripts/v292_batch2_identity_preflight.py
      - name: Persist preflight evidence
        if: always()
        run: |
          set -euo pipefail
          f=evidence/V2.9.2_BATCH2_IDENTITY_PREFLIGHT_1.json
          [ -f "$f" ] || exit 0
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && exit 0
          git commit -m "Persist V2.9.2 Batch-2 identity preflight [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
