name: V2.8.4 PDF Text Extraction Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "PyMuPDF>=1.24,<2"
      - run: python scripts/v284_pdf_text_extractor.py self-test
