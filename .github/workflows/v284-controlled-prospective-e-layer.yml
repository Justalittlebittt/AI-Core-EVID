name: V2.8.4 Controlled Prospective E-Layer Observation
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v284-v2812-prospective-e-shadow-serial
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
      - name: Verify V2.8.12 shadow activation binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/v2812_shadow_accumulator.py)" = "ccd2286013b0e4a8da5ff0ccbe09710a38658ebb"
          test "$(git hash-object scripts/v2812_identity_completion_ratifier.py)" = "226fe586f1325e1753d95303ff021b01481c10ed"
          test "$(git hash-object scripts/v2812_strict_title_identity_prebinder.py)" = "0d30473ae007fd9fa6a3818f3add87c4a37bae38"
          test "$(git hash-object scripts/v284_incremental_e_layer_runner.py)" = "df07a5d2a5771deff39528c3533a39934e96a68c"
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("evidence/V2.8.12_SHADOW_ACCUMULATOR_VALIDATION_RECEIPT.json").read_text())
          si=json.loads(Path("evidence/V2.8.12_SHADOW_ACCUMULATOR_INTEGRITY_AMENDMENT_1.json").read_text())
          ir=json.loads(Path("evidence/V2.8.12_PROSPECTIVE_IDENTITY_COMPLETION_RATIFICATION_AMENDMENT_1.json").read_text())
          irv=json.loads(Path("evidence/V2.8.12_IDENTITY_COMPLETION_RATIFIER_VALIDATION_RECEIPT.json").read_text())
          pb=json.loads(Path("evidence/V2.8.12_STRICT_TITLE_IDENTITY_PREBINDING_AMENDMENT_1.json").read_text())
          pbv=json.loads(Path("evidence/V2.8.12_STRICT_TITLE_IDENTITY_PREBINDER_VALIDATION_RECEIPT.json").read_text())
          c=json.loads(Path("evidence/V2.8.12_SHADOW_CADENCE_CONTRACT.json").read_text())
          a=json.loads(Path("evidence/V2.8.12_SHADOW_CADENCE_AMENDMENT_1.json").read_text())
          a2=json.loads(Path("evidence/V2.8.12_SHADOW_CADENCE_AMENDMENT_2.json").read_text())
          r=json.loads(Path("evidence/V2.8.12_DATA_COMPLETENESS_AND_SCHEDULER_RECOVERY_AMENDMENT_1.json").read_text())
          t=json.loads(Path("evidence/V2.8.12_TRANSPORT_RELIABILITY_AMENDMENT_1.json").read_text())
          assert v["status"]=="PASS"
          assert v["accumulator"]["blob_sha"]=="66fe3735c512e09252ee2400e458334a4043536b"
          assert v["authorization"]["activate_prospective_shadow_accumulation_in_separate_commit"] is True
          assert v["authorization"]["activate_frozen_schedule_in_separate_commit"] is True
          assert v["authorization"]["outcome_research"] is False
          assert v["authorization"]["fold3_access"] is False
          assert v["authorization"]["fold4_access"] is False
          assert si["schema"]=="AI_CORE_EVID_V2_8_12_SHADOW_ACCUMULATOR_INTEGRITY_AMENDMENT_V1"
          assert si["historical_validation"]["historical_validated_blob_sha"]=="66fe3735c512e09252ee2400e458334a4043536b"
          assert si["historical_validation"]["preserved_unchanged"] is True
          assert si["correction"]["corrected_accumulator_blob_sha"]=="ccd2286013b0e4a8da5ff0ccbe09710a38658ebb"
          assert si["correction"]["status_document_restores_fixed_schema_version_and_governance_fields"] is True
          assert si["correction"]["zero_append_does_not_rewrite_shadow_ledger"] is True
          assert si["correction"]["readiness_thresholds_changed"] is False
          assert si["governance"]["research_semantics_changed"] is False
          assert si["governance"]["outcome_research_authorized"] is False
          assert si["governance"]["price_or_return_data_authorized"] is False
          assert si["governance"]["fold3_access"] is False
          assert si["governance"]["fold4_access"] is False
          assert ir["status"]=="ACTIVE_VALIDATED_GENERIC_IDENTITY_COMPLETION_RATIFICATION"
          assert ir["implementation_validation"]["ratifier_blob_sha"]=="226fe586f1325e1753d95303ff021b01481c10ed"
          assert ir["implementation_validation"]["selftest"]=="13/13 PASS"
          assert ir["implementation_validation"]["stable_repeat_append_count"]==0
          assert ir["implementation_validation"]["stable_repeat_duplicate_noops"]==2
          assert ir["governance"]["research_semantics_changed"] is False
          assert ir["governance"]["outcome_research_authorized"] is False
          assert ir["governance"]["price_or_return_data_authorized"] is False
          assert ir["governance"]["fold3_access"] is False
          assert ir["governance"]["fold4_access"] is False
          assert irv["status"]=="PASS"
          assert irv["implementation"]["blob_sha"]=="226fe586f1325e1753d95303ff021b01481c10ed"
          assert irv["validation_sequence"]["stable_idempotence_run"]["selftest"]=="13/13 PASS"
          assert irv["validation_sequence"]["stable_idempotence_run"]["appended"]==0
          assert irv["validation_sequence"]["stable_idempotence_run"]["duplicate_noops"]==2
          assert irv["validated_invariants"]["price_or_return_data_consumed"] is False
          assert pb["status"]=="ACTIVE_VALIDATED_STRICT_TITLE_IDENTITY_PREBINDING"
          assert pb["implementation_validation"]["blob_sha"]=="0d30473ae007fd9fa6a3818f3add87c4a37bae38"
          assert pb["implementation_validation"]["selftest"]=="13/13 PASS"
          assert pb["strict_derivation_rule"]["unique_derived_legal_name_required"] is True
          assert pb["strict_derivation_rule"]["issuer_authored_title_required"] is True
          assert pb["strict_derivation_rule"]["third_party_title_alone_sufficient"] is False
          assert pb["governance"]["fuzzy_identity_inference_authorized"] is False
          assert pb["governance"]["outcome_research_authorized"] is False
          assert pb["governance"]["price_or_return_data_authorized"] is False
          assert pbv["status"]=="PASS"
          assert pbv["implementation"]["blob_sha"]=="0d30473ae007fd9fa6a3818f3add87c4a37bae38"
          assert pbv["validated_scope"]["binding_commit_required_before_ratifier"] is True
          assert c["cadence"]["cron_utc"]=="0 1 * * 2-6"
          assert c["integration"]["active_now"] is False
          assert a["status"]=="ACTIVE_CADENCE_SUPERSESSION"
          assert a["active_cadence"]["cron_utc"]=="0 1 * * *"
          assert a["scan_semantics_unchanged"]["overlap_calendar_days"]==3
          assert a["governance"]["outcome_research_authorized"] is False
          assert a["governance"]["price_or_return_data_authorized"] is False
          assert a["governance"]["fold3_access"] is False
          assert a["governance"]["fold4_access"] is False
          assert a2["status"]=="ACTIVE_SCHEDULER_RELIABILITY_SUPERSESSION"
          assert a2["active_cadence"]["cron_utc"]=="17 1 * * *"
          assert a2["active_cadence"]["top_of_hour"] is False
          assert a2["scan_semantics_unchanged"]["overlap_calendar_days"]==3
          assert a2["problem_elimination_pass"]["selected_action"]=="SUBSTITUTE_TOP_OF_HOUR_WITH_OFF_PEAK_MINUTE_AND_REREGISTER"
          assert a2["governance"]["research_semantics_changed"] is False
          assert a2["governance"]["outcome_research_authorized"] is False
          assert a2["governance"]["price_or_return_data_authorized"] is False
          assert a2["governance"]["fold3_access"] is False
          assert a2["governance"]["fold4_access"] is False
          assert r["status"]=="ACTIVE_POST_SEAL_OPERATIONAL_SEMANTICS_AMENDMENT"
          assert r["operational_model"]["primary_objective"]=="PROSPECTIVE_DATA_COVERAGE_WITH_CAUSAL_TIMESTAMP_INTEGRITY"
          assert r["operational_model"]["scan_window_calendar_days"]==3
          assert r["recovery_capacity"]["maximum_consecutive_missed_daily_cycles_automatically_coverable_by_next_successful_run"]==2
          assert r["recovery_semantics"]["backdating_observation_time_to_the_missed_schedule_time_forbidden"] is True
          assert r["recovery_semantics"]["manual_recovery_dispatch_does_not_count_as_scheduler_empirical_confirmation"] is True
          assert r["governance"]["research_semantics_changed"] is False
          assert r["governance"]["outcome_research_authorized"] is False
          assert r["governance"]["price_or_return_data_authorized"] is False
          assert r["governance"]["fold3_access"] is False
          assert r["governance"]["fold4_access"] is False
          assert t["status"]=="FROZEN_BEFORE_TRANSPORT_PATCH_VALIDATION"
          assert t["problem_elimination_pass"]["selected_action"]=="DELETE_UNNECESSARY_HOME_PREFLIGHT"
          assert t["governance"]["research_semantics_changed"] is False
          assert t["governance"]["outcome_research_authorized"] is False
          assert t["governance"]["price_or_return_data_authorized"] is False
          assert t["governance"]["fold3_access"] is False
          assert t["governance"]["fold4_access"] is False
          print("V2.8.12 strict identity prebinding + corrected shadow accumulator + validated identity ratifier + data-completeness recovery + daily off-peak cadence + transport patch binding PASS")
          PY
      - name: Restore content-addressed E-layer cache
        uses: actions/cache@v4
        with:
          path: .cache/v284_e_layer
          key: v284-e-layer-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v284-e-layer-
      - name: New runner self-test only
        run: python scripts/v284_incremental_e_layer_runner.py self-test
      - name: Resolve activation boundary and scan window
        shell: bash
        run: |
          set -euo pipefail
          ACTIVATION_SHA="$(git log --diff-filter=A --format=%H -1 -- evidence/V2.8.4_PROSPECTIVE_E_LAYER_ACTIVATION.json)"
          test -n "$ACTIVATION_SHA"
          ACTIVATION_AT="$(git show -s --format=%cI "$ACTIVATION_SHA")"
          AS_OF="$(TZ=Asia/Shanghai date +%F)"
          START="$(python - "$AS_OF" <<'PY'
          import sys
          from datetime import date,timedelta
          d=date.fromisoformat(sys.argv[1])
          print((d-timedelta(days=2)).isoformat())
          PY
          )"
          RUN_KEY="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "ACTIVATION_SHA=$ACTIVATION_SHA"
            echo "ACTIVATION_AT=$ACTIVATION_AT"
            echo "AS_OF=$AS_OF"
            echo "START=$START"
            echo "RUN_KEY=$RUN_KEY"
          } >> "$GITHUB_ENV"
      - name: Controlled prospective scan
        run: |
          python scripts/v284_incremental_e_layer_runner.py scan \
            --start "$START" \
            --end "$AS_OF" \
            --out v284_prospective_run \
            --run-id "$RUN_KEY" \
            --activation-sha "$ACTIVATION_SHA" \
            --activation-at "$ACTIVATION_AT"
      - name: Commit authoritative observation receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p evidence/v284_prospective_runs
          cp "v284_prospective_run/V2.8.4_PROSPECTIVE_OBSERVATION_RESULTS_${RUN_KEY}.csv" evidence/v284_prospective_runs/
          cp "v284_prospective_run/V2.8.4_PROSPECTIVE_OBSERVATION_RECEIPT_${RUN_KEY}.json" evidence/v284_prospective_runs/
          git add evidence/v284_prospective_runs/
          git commit -m "Freeze V2.8.4 prospective E-layer observation ${RUN_KEY} [skip ci]"
          git pull --rebase origin main
          git push
          OBS_SHA="$(git rev-parse HEAD)"
          OBS_TIME="$(git show -s --format=%cI HEAD)"
          {
            echo "OBS_SHA=$OBS_SHA"
            echo "OBS_TIME=$OBS_TIME"
          } >> "$GITHUB_ENV"
      - name: Finalize append-only ledger from authoritative commit
        run: |
          python scripts/v284_incremental_e_layer_runner.py finalize \
            --results "evidence/v284_prospective_runs/V2.8.4_PROSPECTIVE_OBSERVATION_RESULTS_${RUN_KEY}.csv" \
            --receipt "evidence/v284_prospective_runs/V2.8.4_PROSPECTIVE_OBSERVATION_RECEIPT_${RUN_KEY}.json" \
            --ledger evidence/V2.8.4_E_LAYER_OBSERVATION_LEDGER.csv \
            --out "v284_prospective_run/V2.8.4_PROSPECTIVE_FINALIZATION_RECEIPT_${RUN_KEY}.json" \
            --observation-commit-sha "$OBS_SHA" \
            --observed-at "$OBS_TIME"
      - name: Commit prospective ledger finalization
        shell: bash
        run: |
          set -euo pipefail
          cp "v284_prospective_run/V2.8.4_PROSPECTIVE_FINALIZATION_RECEIPT_${RUN_KEY}.json" evidence/v284_prospective_runs/
          git add evidence/V2.8.4_E_LAYER_OBSERVATION_LEDGER.csv evidence/v284_prospective_runs/
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "Finalize V2.8.4 prospective E-layer observation ${RUN_KEY} [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Strictly prebind provable issuer identities
        run: python scripts/v2812_strict_title_identity_prebinder.py bind
      - name: Commit new issuer identity bindings before ratification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/V2.8.4_E_LAYER_ISSUER_IDENTITY_BINDINGS.csv
          if test -d evidence/v2812_identity_bindings; then
            git add evidence/v2812_identity_bindings
          fi
          if git diff --cached --quiet; then
            echo "No new strict issuer identity bindings"
          else
            git commit -m "Bind V2.8.12 strict prospective issuer identities [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Append V2.8.12 prospective shadow events and audit blind readiness
        run: python scripts/v2812_shadow_accumulator.py accumulate
      - name: Ratify identity-complete blocked prospective positives
        run: python scripts/v2812_identity_completion_ratifier.py ratify
      - name: Commit V2.8.12 shadow ledger, ratifications and readiness status
        shell: bash
        run: |
          set -euo pipefail
          git add evidence/V2.8.12_PROSPECTIVE_E_SHADOW_LEDGER.csv evidence/V2.8.12_SHADOW_INFORMATION_GATE_STATUS.json evidence/v2812_identity_ratifications
          if git diff --cached --quiet; then
            echo "No new V2.8.12 shadow or identity-ratification evidence"
            exit 0
          fi
          git commit -m "Update V2.8.12 prospective E shadow evidence [skip ci]"
          git pull --rebase origin main
          git push