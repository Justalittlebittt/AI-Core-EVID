name: V2.8.12R R1 Gate Reconcile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "evidence/V2.8.12R_R1_GATE_RECONCILE_ACTIVATION.json"

permissions:
  contents: write

concurrency:
  group: v2812r-r1-gate-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile frozen R1 technical gate
        env:
          PYTHONPATH: scripts
        run: python scripts/v2812r_r1_gate_reconcile.py
      - name: Freeze reconciled R1 gate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/retrospective_feasibility/V2.8.12R_R1_TECHNICAL_GATE_RECONCILED_RECEIPT.json
          git commit -m "Freeze V2.8.12R R1 reconciled technical gate [skip ci]"
          git pull --rebase origin main
          git push
