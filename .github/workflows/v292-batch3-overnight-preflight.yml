name: V2.9.2 Batch 3 Overnight Implementation Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v292-batch3-overnight-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
      - name: Syntax and frozen-scope gate
        run: |
          set -euo pipefail
          python -m py_compile scripts/v291_negative_space_batch1.py
          python -m py_compile scripts/v292_batch3_identity_preflight.py
          python -m py_compile scripts/v292_hybrid_discovery_batch3_chunk.py
          python -m py_compile scripts/v292_hybrid_discovery_batch3_aggregate.py
          grep -q "batch=order\[128:192\]" scripts/v292_hybrid_discovery_batch3_chunk.py
          grep -q "rank_start=129+local_start" scripts/v292_hybrid_discovery_batch3_chunk.py
          grep -q '"batch_index":3,"batch_ranks":\[129,192\]' scripts/v292_hybrid_discovery_batch3_aggregate.py
          grep -q "fail-fast: false" .github/workflows/v292-hybrid-discovery-batch3.yml
      - name: Authorization and deterministic membership gate
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          import v291_negative_space_batch1 as base
          b2=json.loads(Path("evidence/V2.9.2_HYBRID_DISCOVERY_BATCH2_RECEIPT_1.json").read_text())
          pre=json.loads(Path("evidence/V2.9.2_BATCH3_IDENTITY_PREFLIGHT_1.json").read_text())
          assert b2["status"]=="V2_9_2_HYBRID_DISCOVERY_BATCH2_COMPLETE_TOO_SPARSE"
          assert b2["next_batch_authorized"] is True
          owner,_=base.old.load_development_universe()
          order=sorted(owner,key=lambda x:(hashlib.sha256(x.encode()).hexdigest(),x))
          batch=order[128:192]
          assert len(batch)==64
          assert all(owner[x] in (0,1,2) for x in batch)
          assert pre["status"]=="PASS"
          assert pre["batch_index"]==3
          assert pre["batch_ranks"]==[129,192]
          assert pre["security_ids"]==batch
          assert pre["missing_identity_count"]==0
          assert pre["price_or_return_data_consumed"] is False
          assert pre["candidate_outcome_research_executed"] is False
          assert pre["fold3_accessed"] is False
          assert pre["fold4_accessed"] is False
          print("BATCH3_OVERNIGHT_PREFLIGHT_PASS")
          PY
