name: V2.9 Frozen 122 — Fixed 20th Session Prospective Outcome
on:
  pull_request:
    paths:
      - '.github/workflows/v29-forward122-20th-session-outcome.yml'
      - 'scripts/v29_forward122_20th_session_exit_capture.py'
      - 'scripts/test_v29_forward122_20th_session_exit_capture.py'
      - 'scripts/test_v29_forward122_full_pipeline_e2e.py'
      - 'scripts/v29_growth_310_complement_capture.py'
      - 'scripts/test_v29_growth_310_complement_capture.py'
      - 'scripts/v29_eight_pilot_outcome.py'
      - 'scripts/test_v29_eight_pilot_outcome.py'
  workflow_dispatch:
  schedule:
    # Bounded 2026-only post-close capture windows (Beijing 21:25).
    # Actual EXIT = twentieth VERIFIED exchange session, never calendar-day substitution.
    - cron: '25 13 27,30 11 *'
    - cron: '25 13 1-2 12 *'
permissions:
  contents: read
concurrency:
  group: v29-2026-frozen-122-fixed-twentieth-session-outcome
  cancel-in-progress: false

jobs:
  future-boundary-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Regress immutable registered 122 and synthetic-only 20-session data maturity gate
        run: |
          python -m unittest discover -s scripts -p 'test_v29_forward122_20th_session_exit_capture.py' -v
          python -m unittest discover -s scripts -p 'test_v29_forward122_full_pipeline_e2e.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_forward_cohort.py' -v
          python -m unittest discover -s scripts -p 'test_v29_eight_pilot_outcome.py' -v
          python -m unittest discover -s scripts -p 'test_v29_forward122_entry_close_capture.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_310_complement_capture.py' -v

  one-future-outcome-when-mature:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip until maturity and never recapture completed frozen outcome
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          china_year="$(TZ=Asia/Shanghai date +%Y)"
          china_day="$(TZ=Asia/Shanghai date +%F)"
          if [ "$china_year" != "2026" ]; then
            echo "SKIP_OUTSIDE_REGISTERED_2026_FUTURE_EPISODE"
            exit 0
          fi
          if [[ "$china_day" < "2026-11-27" ]]; then
            echo "SKIP_NOT_MATURE_ENOUGH_FOR_20_SESSIONS"
            exit 0
          fi
          if [[ "$china_day" > "2026-12-02" ]]; then
            echo "SKIP_EXPIRED_FORWARD_OUTCOME_SOURCE_WINDOW"
            exit 0
          fi
          if [ -e research/V2.9_FORWARD_122_20_SESSION_OUTCOME_2026/20_SESSION_RESEARCH_VERDICT.json ]; then
            echo "SKIP_OUTCOME_ALREADY_CAPTURED_FROM_FIXED_SOURCES"
            exit 0
          fi
          if [ ! -e research/V2.9_FORWARD_122_ENTRY_20261102/ENTRY_SNAPSHOT_122.json ]; then
            echo "ENTRY_EVIDENCE_NOT_YET_SEALED_NO_OUTCOME_POSSIBLE"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Check immutable 122 protocol and 20 session no-lookahead outcome arithmetic
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m unittest discover -s scripts -p 'test_v29_forward122_20th_session_exit_capture.py' -v
          python -m unittest discover -s scripts -p 'test_v29_forward122_full_pipeline_e2e.py' -v
          python -m unittest discover -s scripts -p 'test_v29_growth_forward_cohort.py' -v
          python -m unittest discover -s scripts -p 'test_v29_eight_pilot_outcome.py' -v
      - name: Install historical quote provider version already proven on 122 pre-entry data
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check baostock==0.9.4
      - name: Query only after actual twentieth official session has CLOSED; preserve all 122 and original exact entry
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/v29_forward122_20th_session_exit_capture.py --out /tmp/v29-forward122-20th-outcome
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          base=Path('/tmp/v29-forward122-20th-outcome')
          r=json.loads((base/'20_SESSION_RESEARCH_VERDICT.json').read_text())
          o=json.loads((base/'OUTCOMES_122.json').read_text())
          raw=gzip.decompress((base/'RAW_VENDOR_STOCK_AND_H00300_INDEX.json.gz').read_bytes())
          assert len(o['verified_exchange_sessions'])==20
          assert o['verified_exchange_sessions'][0]=='2026-11-02'
          assert r['fixed_exit_session']==o['verified_exchange_sessions'][19]
          assert r['quote_source_eligible_count']+r['quote_source_incomplete_count']==122
          assert r['frozen_cohort_count']==len(o['securities'])==122
          assert hashlib.sha256(raw).hexdigest()==r['source_bytes_sha256']
          assert not r['trade_authorized'] and r['live_buy_eligibility']=='NOT_AUTHORIZED'
          assert not r['actual_entry_exit_fills_proven']
          assert r['outcome_evaluation']['strategy_validated'] is False
          print('FROZEN_122_ONE_EPISODE_RESEARCH_STATUS',
                r['outcome_evaluation']['status'],'EXACT_EXIT',r['fixed_exit_session'],
                'QUOTES',r['quote_source_eligible_count'],'/122',
                'OFFICIAL_BENCHMARK',r['benchmark_source_status'])
          PY
      - name: Evaluate preregistered eight from the same matured 122 source, never refetch quotes
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          base=Path('/tmp/v29-forward122-20th-outcome')
          verdict=json.loads((base/'20_SESSION_RESEARCH_VERDICT.json').read_text())
          if verdict['outcome_evaluation']['status']!='ONE_EPISODE_DESCRIPTIVE_NOT_BUY_EVIDENCE':
              print('FROZEN_EIGHT_NOT_COMPUTABLE_INCOMPLETE_PARENT')
          else:
              destination=base/'FROZEN_EIGHT_PILOT_RESULT.json'
              subprocess.run(['python','scripts/v29_eight_pilot_outcome.py',
                  '--parent',str(base/'OUTCOMES_122.json'),'--out',str(destination)],check=True)
              result=json.loads(destination.read_text())
              assert result['selected_count']==8
              assert result['parent_count']==122
              assert result['status']=='ONE_EPISODE_EXPLORATORY_NOT_BUY_EVIDENCE'
              assert result['trade_authorized'] is False
              assert result['live_buy_eligibility']=='NOT_AUTHORIZED'
              print('FROZEN_EIGHT_VS_122_COMPUTED_WITHOUT_EXTRA_QUOTES')
          PY
      - name: Persist full 122 outcome if complete, or immutable run-scoped incomplete result for another bounded attempt
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/v29-forward122-20th-outcome/20_SESSION_RESEARCH_VERDICT.json'))
          print(d['outcome_evaluation']['status'])
          PY
          )"
          if [ "$status" = "ONE_EPISODE_DESCRIPTIVE_NOT_BUY_EVIDENCE" ]; then
            destination="research/V2.9_FORWARD_122_20_SESSION_OUTCOME_2026"
          else
            destination="research/V2.9_FORWARD_122_OUTCOME_ATTEMPTS_2026/run_$GITHUB_RUN_ID"
          fi
          if [ -e "$destination/20_SESSION_RESEARCH_VERDICT.json" ]; then
            echo "IMMUTABLE_OUTCOME_SOURCE_VINTAGE_ALREADY_EXISTS"
            exit 1
          fi
          mkdir -p "$destination"
          cp /tmp/v29-forward122-20th-outcome/20_SESSION_RESEARCH_VERDICT.json "$destination/"
          cp /tmp/v29-forward122-20th-outcome/OUTCOMES_122.json "$destination/"
          cp /tmp/v29-forward122-20th-outcome/RAW_VENDOR_STOCK_AND_H00300_INDEX.json.gz "$destination/"
          if [ -f /tmp/v29-forward122-20th-outcome/FROZEN_EIGHT_PILOT_RESULT.json ]; then
            cp /tmp/v29-forward122-20th-outcome/FROZEN_EIGHT_PILOT_RESULT.json "$destination/"
          fi
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$destination/"
          git commit -m "research(v29): seal fixed 122 twentieth-session evidence $status, no BUY [skip ci]"
          git push origin HEAD:main
          echo "PERSISTED_OUTCOME_EVIDENCE $destination"
      - name: Preserve raw proof regardless of source or repository outcome
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v29-122-20th-session-source-and-outcome
          path: /tmp/v29-forward122-20th-outcome/
          if-no-files-found: warn
          retention-days: 30
  conditional-310-supplement-when-parent-sealed:
    # Separate optional post-parent job. A failed 188-name supplement cannot
    # rewrite or invalidate the frozen original 122-source experiment.
    needs: one-future-outcome-when-mature
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs['one-future-outcome-when-mature'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Only add fixed complement after complete parent and within same capture day
        id: complement_gate
        shell: bash
        run: |
          set -euo pipefail
          source="research/V2.9_FORWARD_122_20_SESSION_OUTCOME_2026/OUTCOMES_122.json"
          completed="research/V2.9_FORWARD_310_CONDITIONAL_20261102/310_CONDITIONAL_RESULT.json"
          if [ -e "$completed" ]; then
            echo "SUPPLEMENT_ALREADY_COMPLETE_NO_DUPLICATE"
            exit 0
          fi
          if [ ! -e "$source" ]; then
            echo "ORIGINAL_122_NOT_COMPLETE_NO_SUPPLEMENT"
            exit 0
          fi
          original_day="$(python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p=json.load(open("research/V2.9_FORWARD_122_20_SESSION_OUTCOME_2026/OUTCOMES_122.json"))
          print(datetime.fromisoformat(p["capture_timestamp"]).astimezone(ZoneInfo("Asia/Shanghai")).date())
          PY
          )"
          now_day="$(TZ=Asia/Shanghai date +%F)"
          if [ "$now_day" != "$original_day" ]; then
            echo "SUPPLEMENT_WINDOW_NOT_SAME_CAPTURE_VINTAGE"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Synthetic-only complement capture regressions
        if: steps.complement_gate.outputs.run == 'true'
        run: python -m unittest discover -s scripts -p 'test_v29_growth_310_complement_capture.py' -v
      - name: Install already proven free quote dependency
        if: steps.complement_gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check baostock==0.9.4
      - name: Capture only 188 fixed complement quotes, reuse sealed original 122, never change primary result
        if: steps.complement_gate.outputs.run == 'true'
        run: python scripts/v29_growth_310_complement_capture.py --out /tmp/v29-310-supplement
      - name: Seal complete contrast or immutable incomplete source attempt
        if: steps.complement_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - <<'PY'
          import json
          r=json.load(open("/tmp/v29-310-supplement/310_CONDITIONAL_RESULT.json"))
          print(r["status"])
          PY
          )"
          if [ "$status" = "ONE_EPISODE_DESCRIPTIVE_NOT_BUY_EVIDENCE" ]; then
            dest="research/V2.9_FORWARD_310_CONDITIONAL_20261102"
          else
            dest="research/V2.9_FORWARD_310_CONDITIONAL_ATTEMPTS_2026/run_$GITHUB_RUN_ID"
          fi
          if [ -e "$dest/310_CONDITIONAL_RESULT.json" ]; then
            echo "SUPPLEMENT_RESULT_ALREADY_STORED"
            exit 1
          fi
          mkdir -p "$dest"
          cp /tmp/v29-310-supplement/310_CONDITIONAL_RESULT.json "$dest/"
          cp /tmp/v29-310-supplement/310_SAME_VINTAGE_CLOSE_PROXIES.json "$dest/"
          cp /tmp/v29-310-supplement/RAW_188_QUOTES.json.gz "$dest/"
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$dest/"
          git commit -m "research(v29): preserve fixed 310 conditional source status $status, no BUY [skip ci]"
          git push origin HEAD:main
          echo "PERSISTED_CONDITIONAL_310 $dest"
      - name: Preserve raw complement sources even if repository write fails
        if: always() && steps.complement_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v29-310-conditional-same-day-supplement
          path: /tmp/v29-310-supplement/
          if-no-files-found: warn
          retention-days: 30
