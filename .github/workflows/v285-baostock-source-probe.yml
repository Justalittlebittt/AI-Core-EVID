name: V2.8.5 BaoStock Source Probe
on:
  push:
    paths:
      - "scripts/v285_baostock_source_probe.py"
      - ".github/workflows/v285-baostock-source-probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pinned BaoStock wheel
        run: |
          python -m pip download --no-deps --only-binary=:all: baostock==0.9.4 -d wheelhouse
          test "$(sha256sum wheelhouse/baostock-0.9.4-py3-none-any.whl | awk '{print $1}')" = "0bf71c6069ab5890ff3596632f9c3f8f1fbc6bfcac582c2f9d6a5c11ab2cfaf8"
          python -m pip install wheelhouse/baostock-0.9.4-py3-none-any.whl
      - name: Probe self-test
        run: python scripts/v285_baostock_source_probe.py self-test
      - name: Controlled disjoint-period network probe
        run: python scripts/v285_baostock_source_probe.py run
      - name: Freeze compact probe receipt
        run: |
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          cp v285_probe/V2.8.5_BAOSTOCK_SOURCE_PROBE_RECEIPT.json evidence/
          git add evidence/V2.8.5_BAOSTOCK_SOURCE_PROBE_RECEIPT.json
          git commit -m "Freeze V2.8.5 BaoStock source probe [skip ci]"
          git pull --rebase origin main
          git push
