name: V2.8.3 Prospective Outcome Resolver
on:
  schedule:
    - cron: "0 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v283-prospective-outcome-resolver
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy>=2.0" "pandas>=2.2" "duckdb>=1.1" "huggingface_hub>=0.35"
      - name: Resolve matured D+5/D+10 outcomes only
        run: python scripts/v283_outcome_resolver.py auto-resolve
      - name: Freeze newly resolved outcomes if produced
        run: |
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A evidence/v283_outcomes evidence/V2.8.3_PROSPECTIVE_OUTCOME_LEDGER.csv || true
          if git diff --cached --quiet; then
            echo "No newly mature resolvable outcomes."
            exit 0
          fi
          git commit -m "Freeze V2.8.3 prospective outcomes [skip ci]"
          git pull --rebase origin main
          git push
