name: V2.9.2 Batch 2 Identity Fallback Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v292-batch2-identity-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          pip install "playwright>=1.55"
          playwright install --with-deps chromium
      - name: Preflight validator
        run: python -m py_compile scripts/v292_batch2_identity_fallback_validator.py
      - name: Validate missing Batch-2 identities
        run: python scripts/v292_batch2_identity_fallback_validator.py
      - name: Persist validation evidence
        if: always()
        run: |
          set -euo pipefail
          f=evidence/V2.9.2_BATCH2_IDENTITY_FALLBACK_VALIDATION_1.json
          [ -f "$f" ] || exit 0
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && exit 0
          git commit -m "Persist V2.9.2 Batch-2 identity fallback validation [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
