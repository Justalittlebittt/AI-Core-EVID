name: V2.8.4 Setup Admission Envelope Validation
on:
  push:
    paths:
      - "scripts/v284_setup_admission_envelope.py"
      - "evidence/V2.8.4_SETUP_ADMISSION_ENVELOPE_CONTRACT.json"
      - ".github/workflows/v284-setup-admission-envelope-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/v284_setup_admission_envelope.py self-test
