name: V2.7.27 Sample E2E Filing Gate
on:
  push:
    branches: [main]
    paths:
      - "scripts/v2727_sample_e2e.py"
      - ".github/workflows/v2727-sample-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install "playwright>=1.55"
          python -m playwright install --with-deps chromium
      - name: Execute two-issuer sample gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/v2727_sample_e2e.py | tee v2727_sample.log
      - if: always()
        run: |
          mkdir -p v2727_sample_artifacts
          cp v2727_sample.log v2727_sample_artifacts/V2727_SAMPLE_LOG.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_CORE_EVID_V2.7.27_SAMPLE_E2E
          path: v2727_sample_artifacts/
          if-no-files-found: error
          retention-days: 30
