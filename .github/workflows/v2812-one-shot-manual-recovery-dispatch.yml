name: V2.8.12 One-shot Manual Recovery Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v2812-one-shot-manual-recovery-dispatch.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch frozen active prospective collection workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run v284-controlled-prospective-e-layer.yml --ref main
