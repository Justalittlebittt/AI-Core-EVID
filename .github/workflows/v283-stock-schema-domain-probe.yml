name: V2.8.3 Stock Schema Domain Probe
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: pip install "duckdb>=1.1,<2"
      - name: Probe frozen stock categorical domains
        run: python scripts/v283_stock_schema_domain_probe.py
      - name: Persist domain receipt
        run: |
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/V2.8.3_STOCK_SCHEMA_DOMAIN_PROBE_1.json
          git commit -m "Persist V2.8.3 stock schema domain probe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
