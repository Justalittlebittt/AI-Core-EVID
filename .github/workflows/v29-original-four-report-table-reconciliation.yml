name: V2.9 Historical Original Annual Table Cells vs Later Restated Vendor Vintage
on:
  pull_request:
    paths:
      - '.github/workflows/v29-original-four-report-table-reconciliation.yml'
      - 'scripts/v29_prior_year_four_original_table_reconciliation.py'
      - 'scripts/test_v29_prior_year_four_original_table_reconciliation.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v29-original-four-report-table-reconciliation.yml'
      - 'scripts/v29_prior_year_four_original_table_reconciliation.py'
permissions:
  contents: read

jobs:
  original-source-table-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install free real original PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Independently reopen four preserved original PDF binaries, verify all 16 reviewed current-year table fields
        run: |
          python -m unittest discover -s scripts -p 'test_v29_prior_year_four_original_table_reconciliation.py' -v
          python -m unittest discover -s scripts -p 'test_v29_prior_year_four_original_pdfs.py' -v
      - name: Produce truthful temporary version-separated research receipt
        run: |
          python scripts/v29_prior_year_four_original_table_reconciliation.py --out /tmp/v29-four-original-tables.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/v29-four-original-tables.json"))
          assert len(d["rows"])==16
          assert d["matching_to_vendor_at_original_report_precision"]==14
          assert d["nonmatching_to_vendor_at_original_report_precision"]==2
          print("ORIGINAL_VS_LATE_RESTATED_FY2022_600088",[
              (x["financial_field"],
               x["original_annual_report_current_year_table_value"],
               x["retrospective_2026_vendor_financial_value"],
               x["vendor_minus_original_at_reported_precision"])
              for x in d["rows"] if not x["same_as_original_table_printed"]])
          assert d["live_buy_eligibility"]=="NOT_AUTHORIZED"
          PY

  persist-table-mapped-four-real-original-research:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install free PDF reader and rerun real original PDF tests
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.26.5
          python -m unittest discover -s scripts -p 'test_v29_prior_year_four_original_table_reconciliation.py' -v
      - name: Commit 16 table-cell comparisons preserving original vs later adjusted FY2022 financial information
        run: |
          set -euo pipefail
          dest=research/V2.9_2023_2024_FOUR_ORIGINAL_REPORT_CURRENT_YEAR_TABLE_AUDIT.json
          test ! -e "$dest"
          python scripts/v29_prior_year_four_original_table_reconciliation.py --out "$dest"
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$dest"
          git commit -m "research(v29): preserve original as-issued 4 PDFs 16 reported fields vs later 600088 restatement; no PIT/OOS [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "ORIGINAL_FY2022_2023_16_TABLE_FIELD_VINTAGES_DURABLY_ARCHIVED"
      - name: Retain comparison if archive write fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-original-fy2022-fy2023-four-table-16-field-reconciliation
          path: research/V2.9_2023_2024_FOUR_ORIGINAL_REPORT_CURRENT_YEAR_TABLE_AUDIT.json
          if-no-files-found: warn
          retention-days: 14
