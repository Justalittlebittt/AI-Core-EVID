name: V2.8.7 One-Time Q5 Setup Shape Research
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v287-one-time-q5-setup-shape
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.3.2 pandas==2.3.2 pyarrow==21.0.0
      - name: Verify one-time Q5 shape activation
        run: python scripts/v287_q5_setup_shape_gate.py
      - name: Evaluate untouched fold2 Q5 setup shape
        run: python scripts/v287_locked_q5_setup_shape.py evaluate
      - name: Freeze terminal Q5 setup-shape result
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/V2.8.7_FOLD2_Q5_SETUP_SHAPE_DAILY_METRICS.csv evidence/V2.8.7_Q5_SETUP_SHAPE_FINAL_RECEIPT.json
          git commit -m "Freeze V2.8.7 fold2 Q5 setup-shape result [skip ci]"
          git pull --rebase origin main
          git push
