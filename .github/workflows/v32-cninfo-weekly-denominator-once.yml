name: V3.2 official information-source feasibility one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-cninfo-weekly-denominator-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Conclude two-day source identity and unit-rounding reconciliation
        run: |
          python scripts/v32_sse_margin_two_day_source_probe.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/v32_sse_margin_source_two_day.json').read_text())
          assert len(r['days'])==2
          assert not r['stock_outcome_returns_opened']
          assert not r['all_A_share_universe_covered']
          assert not r['trade_authorized']
          print('OFFICIAL_MARGIN_SOURCE_ONLY_NO_ALPHA')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-sse-margin-source-two-day
          path: /tmp/v32_sse_margin_source_two_day.json
          retention-days: 14
