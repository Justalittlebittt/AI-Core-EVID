name: V3.2 CNINFO partitioned announcement denominator feasibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-cninfo-weekly-denominator-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check official earnings guidance category on sole high-volume day
        run: |
          python scripts/v32_cninfo_category_single_day_probe.py --output /tmp/v32-weekly-denominator.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/v32-weekly-denominator.json").read_text())
          assert d["day"]=="2026-07-15"
          assert d["prices_opened"] is False
          assert d["all_market_event_recall_certified"] is False
          assert d["buy_authorized"] is False
          print("CATEGORY_SOURCE_PROBE_FINISHED_NO_ALPHA_CLAIM")
          PY
      - name: Retain exact source-query IDs and pagination fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-cninfo-one-day-earnings-category-admission
          path: /tmp/v32-weekly-denominator.json
          retention-days: 14
