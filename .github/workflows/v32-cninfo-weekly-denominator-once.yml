name: V3.2 source-admission one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-cninfo-weekly-denominator-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Final queryDate-adapted historical block-trade source admission check
        run: |
          python scripts/v32_sse_block_trade_source_one_shot.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/v32_sse_block_trade_probe.json').read_text())
          assert len(x['dates'])==2
          assert x['stock_return_outcomes_read'] is False
          assert x['trade_authorized'] is False
          print('SSE_BULK_SOURCE_CHECK_DOES_NOT_CLAIM_ALPHA')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-sse-bulk-source-date-filter-proof-only
          path: /tmp/v32_sse_block_trade_probe.json
          retention-days: 14
