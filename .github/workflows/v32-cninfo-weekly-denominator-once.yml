name: V3.2 single official commodity source feasibility runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-cninfo-weekly-denominator-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Identify exact SHFE field keys on two fixed finished sessions
        run: |
          python scripts/v32_shfe_two_day_copper_source_admission.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/v32-shfe-two-day-admission.json').read_text())
          assert d['contract']=='cu2612'
          assert len(d['days'])==2
          assert d['no_stock_return_read'] is True
          assert d['trade_authorized'] is False
          print('SHFE_SOURCE_ONLY_PROBE_COMPLETE_NO_ALPHA_CLAIM')
          PY
      - name: Retain original source endpoint admission outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-shfe-cu2612-two-day-source-admission
          path: /tmp/v32-shfe-two-day-admission.json
          retention-days: 14
