name: V3.2 reusable source and decision boundary one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-cninfo-weekly-denominator-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test board-aware decision-time affordability without futures leakage
        run: |
          cd scripts
          python -m unittest -v test_v32_candidate_tradeability.py
          python - <<'PY'
          from v32_candidate_tradeability import evaluate
          x=evaluate([
              {'security_id':'SSE:688122','reference_price_cny':'60','reference_session':'2026-05-29'},
              {'security_id':'SSE:603256','reference_price_cny':'20','reference_session':'2026-05-29'}
          ],{'cash_cny':100000,'slot_cap_cny':10000,'fee_reserve_cny':100,
             'permissions':{'main':True,'chinext':True,'star':True}})
          assert x['trade_authorized'] is False
          assert [r['gate'] for r in x['original_candidates_in_original_order']] == [
              'BLOCKED_PAPER_BUY','PAPER_MIN_LOT_AFFORDABLE_ONLY']
          print('NO_RANK_REPLACEMENT_OR_TRADE_PROMOTION')
          PY
