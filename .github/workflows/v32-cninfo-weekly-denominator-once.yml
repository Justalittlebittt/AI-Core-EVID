name: V3.2 Weekly CNINFO announcement denominator feasibility once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-cninfo-weekly-denominator-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test independent seven-day windows and detect repeated pages
        run: |
          python scripts/v32_cninfo_weekly_denominator_feasibility.py --output /tmp/v32-weekly-denominator.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/v32-weekly-denominator.json").read_text())
          assert d["window_count"]==9
          assert not d["stock_outcome_prices_opened"]
          assert not d["complete_revision_market_universe_proven"]
          assert not d["live_buy_authorized"]
          print("WEEKLY_SOURCE_PROBE_FINISHED_NO_ALPHA_CLAIM")
          PY
      - name: Retain exact source-query IDs and pagination fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-cninfo-weekly-denominator-source-probe
          path: /tmp/v32-weekly-denominator.json
          retention-days: 14
