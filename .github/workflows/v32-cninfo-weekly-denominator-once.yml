name: V3.2 CNINFO partitioned announcement denominator feasibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-cninfo-weekly-denominator-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check sole unresolved week using seven source-only daily partitions
        run: |
          python scripts/v32_cninfo_unresolved_week_daily_probe.py --output /tmp/v32-weekly-denominator.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/v32-weekly-denominator.json").read_text())
          assert len(d["rows"])==7
          assert d["source_only"] is True
          assert d["all_market_title_or_keyword_recall_unproven"] is True
          assert not d["live_buy_authorized"]
          print("SUBDAY_SOURCE_PROBE_FINISHED_NO_ALPHA_CLAIM")
          PY
      - name: Retain exact source-query IDs and pagination fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-cninfo-unresolved-week-subday-source-probe
          path: /tmp/v32-weekly-denominator.json
          retention-days: 14
