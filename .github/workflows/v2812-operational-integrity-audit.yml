name: V2.8.12 Prospective Automation Operational Integrity Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
      - name: Verify patched runner and audit blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/v284_incremental_e_layer_runner.py)" = "cb903ea843c796356f28dd3833954cf7faaf56e2"
          test "$(git hash-object scripts/v2812_operational_integrity_audit.py)" = "445a3a7c8b524998b7d8fe9eaa7b93e7875202d2"
      - name: Run unchanged V2.8.4 runner self-test
        run: python scripts/v284_incremental_e_layer_runner.py self-test
      - name: Run V2.8.12 operational integrity audit
        run: python scripts/v2812_operational_integrity_audit.py
