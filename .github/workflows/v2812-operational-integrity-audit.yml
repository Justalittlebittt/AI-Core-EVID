name: V2.8.12 Prospective Automation Operational Integrity Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/v2812-operational-integrity-audit.yml'
      - '.github/workflows/v284-controlled-prospective-e-layer.yml'
      - 'scripts/v284_incremental_e_layer_runner.py'
      - 'scripts/v2812_operational_integrity_audit.py'
      - 'scripts/v2812_shadow_accumulator.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "playwright>=1.55" "PyMuPDF>=1.24,<2" "pandas>=2.2"
      - name: Verify patched runner and audit blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/v284_incremental_e_layer_runner.py)" = "6aa362b1caed43924bbd94434524f104c0203069"
          test "$(git hash-object scripts/v2812_operational_integrity_audit.py)" = "8045a7ef130faea4c5dab2f7e8135302d9635a64"
      - name: Run unchanged V2.8.4 runner self-test
        run: python scripts/v284_incremental_e_layer_runner.py self-test
      - name: Run V2.8.12 operational integrity audit
        run: python scripts/v2812_operational_integrity_audit.py
