name: V2.7.32 First60 Ledger Validation
on:
  push:
    branches: [main]
    paths:
      - "scripts/v2732_first60_ledger.py"
      - ".github/workflows/v2732-first60-ledger.yml"
      - "evidence/V2.7.32_FIRST60_LEDGER_GENESIS.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate strategy-agnostic First60 ledger gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/v2732_first60_ledger.py self-test | tee v2732_first60.log
      - name: Persist validation receipt
        if: success()
        run: |
          cp v2732_first60_validation/V2.7.32_FIRST60_LEDGER_VALIDATION_RECEIPT.json evidence/
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/V2.7.32_FIRST60_LEDGER_VALIDATION_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze V2.7.32 First60 ledger validation"
            git push
          fi
      - name: Upload validation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_CORE_EVID_V2.7.32_FIRST60_LEDGER_VALIDATION
          path: |
            v2732_first60_validation/
            v2732_first60.log
          if-no-files-found: error
          retention-days: 30
