name: V2.7.28 CNInfo Request Contract
on:
  push:
    branches: [main]
    paths:
      - "scripts/v2728_cninfo_contract_probe.py"
      - ".github/workflows/v2728-cninfo-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "playwright>=1.55"
          python -m playwright install --with-deps chromium
      - run: python scripts/v2728_cninfo_contract_probe.py | tee contract.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_CORE_EVID_V2.7.28_CNINFO_REQUEST_CONTRACT
          path: |
            v2728_contract_artifacts/
            contract.log
          if-no-files-found: error
          retention-days: 30
