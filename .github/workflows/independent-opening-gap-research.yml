name: Independent Opening Gap Research
on:
  pull_request:
    paths:
      - '.github/workflows/independent-opening-gap-research.yml'
      - 'research/EXPLORATORY_OPENING_GAP_V1.json'
      - 'scripts/v29_exploratory_opening_gap.py'
      - 'scripts/test_v29_exploratory_opening_gap.py'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install previously pinned research dependencies
        run: python -m pip install "huggingface_hub==1.32.0" "duckdb==1.5.5" "numpy==1.26.4" "pandas==2.2.3" "pyarrow==17.0.0"
      - name: Run leakage and admission checks on synthetic inputs
        run: python -m unittest discover -s scripts -p 'test_v29_exploratory_opening_gap.py' -v
      - name: Run frozen-history exploratory evaluation
        run: |
          python scripts/v29_exploratory_opening_gap.py | tee /tmp/opening-gap-summary.log
          python - <<'PY'
          import json
          with open('research_results/exploratory_opening_gap_v1.json') as f:
              r=json.load(f)
          assert r['no_trade_authorization'] is True
          assert r['evidence_strength']=='UNSCORED_PENDING_THRESHOLD_CONTRACT'
          assert r['days_evaluated']>0
          assert r['mean_excess_vs_CSI300'] is not None, 'CSI300 benchmark join missing'
          assert r['contract_sha256'] and len(r['contract_sha256'])==64
          print('EXPLORATORY_REAL_DATA_EXECUTED days=',r['days_evaluated'],
                'mean_excess=',r['overall']['mean_excess_return'],
                'coverage=',r['selected_return_coverage'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-gap-result
          path: research_results/exploratory_opening_gap_v1.json
          if-no-files-found: warn
          retention-days: 30
