name: V2.7.29 Targeted Ambiguity Probe
on:
  push:
    branches: [main]
    paths:
      - "scripts/v2729_targeted_ambiguity_probe.py"
      - ".github/workflows/v2729-targeted-ambiguity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "playwright>=1.55"
          python -m playwright install --with-deps chromium
      - name: Materialize only ambiguous candidates
        run: python scripts/v2729_targeted_ambiguity_probe.py | tee ambiguity.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_CORE_EVID_V2.7.29_TARGETED_AMBIGUITY
          path: |
            v2729_ambiguity_probe/
            ambiguity.log
          if-no-files-found: error
          retention-days: 30
