name: V2.8.6 Fold1 Source Acquisition
on:
  push:
    paths:
      - ".github/workflows/v286-fold1-source-acquisition.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v286-fold1-source-acquisition
  cancel-in-progress: false
jobs:
  acquire_stock_buckets:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        bucket: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned acquisition runtime
        run: |
          python -m pip download --no-deps --only-binary=:all: baostock==0.9.4 -d wheelhouse
          test "$(sha256sum wheelhouse/baostock-0.9.4-py3-none-any.whl | awk '{print $1}')" = "0bf71c6069ab5890ff3596632f9c3f8f1fbc6bfcac582c2f9d6a5c11ab2cfaf8"
          python -m pip install wheelhouse/baostock-0.9.4-py3-none-any.whl pyarrow==21.0.0
      - name: Acquire deterministic fold1 stock bucket
        run: |
          python scripts/v286_fold1_source_acquisition.py             --bucket ${{ matrix.bucket }}             --out "v286_bucket_${{ matrix.bucket }}"
      - uses: actions/upload-artifact@v4
        with:
          name: v286-fold1-stock-bucket-${{ matrix.bucket }}
          path: v286_bucket_${{ matrix.bucket }}/*
          if-no-files-found: error
          retention-days: 1

  acquire_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned acquisition runtime
        run: |
          python -m pip download --no-deps --only-binary=:all: baostock==0.9.4 -d wheelhouse
          test "$(sha256sum wheelhouse/baostock-0.9.4-py3-none-any.whl | awk '{print $1}')" = "0bf71c6069ab5890ff3596632f9c3f8f1fbc6bfcac582c2f9d6a5c11ab2cfaf8"
          python -m pip install wheelhouse/baostock-0.9.4-py3-none-any.whl pyarrow==21.0.0
      - name: Acquire fold1 benchmark
        run: |
          python scripts/v286_fold1_source_acquisition.py             --benchmark             --out v286_benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: v286-fold1-benchmark
          path: v286_benchmark/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [acquire_stock_buckets, acquire_benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow==21.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: v286-fold1-*
          merge-multiple: true
          path: v286_artifacts
      - name: Validate and merge fold1 source
        run: |
          python scripts/v286_fold1_source_finalize.py             --artifact-root v286_artifacts             --out v286_final
      - name: Freeze fold1 source snapshot
        run: |
          set -euo pipefail
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p evidence/v286_fold1_source
          cp v286_artifacts/*.parquet evidence/v286_fold1_source/
          cp v286_artifacts/V2.8.6_FOLD1_BAOSTOCK_BUCKET_*_RECEIPT.json evidence/v286_fold1_source/
          cp v286_artifacts/V2.8.6_FOLD1_BAOSTOCK_QUERY_MANIFEST_BUCKET_*.csv evidence/v286_fold1_source/
          cp v286_artifacts/V2.8.6_FOLD1_BAOSTOCK_BENCHMARK_RECEIPT.json evidence/v286_fold1_source/
          cp v286_final/V2.8.6_FOLD1_BAOSTOCK_QUERY_MANIFEST.csv evidence/v286_fold1_source/
          cp v286_final/V2.8.6_FOLD1_SOURCE_SNAPSHOT_RECEIPT.json evidence/
          git add evidence/v286_fold1_source evidence/V2.8.6_FOLD1_SOURCE_SNAPSHOT_RECEIPT.json
          git commit -m "Freeze V2.8.6 fold1 source snapshot [skip ci]"
          git pull --rebase origin main
          git push
