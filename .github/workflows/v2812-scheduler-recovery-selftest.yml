name: V2.8.12 Scheduler Recovery Semantics Self-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scheduler recovery and data-completeness semantics
        run: python scripts/v2812_scheduler_recovery_semantics.py
