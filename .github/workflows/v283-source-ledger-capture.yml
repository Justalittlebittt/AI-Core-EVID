name: V2.8.3 Prospective Source Pin Capture
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v283-source-ledger-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.35"
      - name: Capture immutable source identity if changed
        run: python scripts/v283_prospective_source_ledger.py capture
      - name: Freeze new source pin
        run: |
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/v283_source_pins/
          if git diff --cached --quiet; then
            echo "No new source identity."
            exit 0
          fi
          git commit -m "Freeze V2.8.3 prospective source pin [skip ci]"
          git pull --rebase origin main
          git push
