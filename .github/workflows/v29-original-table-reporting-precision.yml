name: V2.9 Audit Original Financial Report Reporting Units and False Restatement Alerts
on:
  pull_request:
    paths:
      - '.github/workflows/v29-original-table-reporting-precision.yml'
      - 'scripts/v29_original_table_reporting_precision.py'
      - 'scripts/v29_original_24_precision_reconciliation.py'
      - 'scripts/test_v29_original_24_precision_reconciliation.py'
      - 'scripts/v29_prior_year_original_table_batch_24.py'
      - 'scripts/test_v29_original_year_table_batch_24.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v29-original-table-reporting-precision.yml'
      - 'scripts/v29_original_24_precision_reconciliation.py'
permissions:
  contents: read

jobs:
  source-precision-without-refetch-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned free PDF table reader for existing four original binary regressions
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Reconcile all 63 existing 24-case PDF table cells using units from the ACTUAL PDF, no vendor recapture
        run: |
          python -m unittest discover -s scripts -p 'test_v29_original_24_precision_reconciliation.py' -v
          python -m unittest discover -s scripts -p 'test_v29_original_year_table_batch_24.py' -v
          python scripts/v29_original_24_precision_reconciliation.py --out /tmp/v29-24-source-unit-report.json

  persist-corrected-original-vs-retrospective-source-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen 24 raw source receipt and all 63 finance-field unit tolerances with no source network
        run: python -m unittest discover -s scripts -p 'test_v29_original_24_precision_reconciliation.py' -v
      - name: Write source-vintage reporting-precision corrections, preserving initial fixed 24 receipt
        run: |
          set -euo pipefail
          target=research/v29_original_table_24_20261031/PRECISION_RECONCILIATION.json
          test ! -e "$target"
          python scripts/v29_original_24_precision_reconciliation.py --out "$target"
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("research/v29_original_table_24_20261031/")
          d=json.loads((p/"PRECISION_RECONCILIATION.json").read_bytes())
          assert d["fixed_issuer_year_denominator"]==24
          assert d["fields_with_source_table_cell_and_vendor"]==63
          assert d["false_vintage_conflicts_removed_by_thousand_yuan_reporting_precision"]==2
          assert d["confirmed_after_source_unit_rounding_review"]==3
          assert d["underlying_frozen_24_current_year_source_evidence_sha256"]==hashlib.sha256(
              (p/"FIXED_24_ORIGINAL_YEAR_TABLE_FIELDS.json").read_bytes()).hexdigest()
          assert d["live_buy_eligibility"]=="NOT_AUTHORIZED"
          print("SOURCE_RECONCILIATION_CORRECTED",[(x["security_id"],x["financial_field"]) for x in d["remaining_review_issuer_field_pairs"]])
          PY
          git config user.name "ai-core-evid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$target"
          git commit -m "research(v29): correct 24 PDF source report comparison precision, only 3 unresolved cross-vintage differences [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve corrected source-only receipt if repository update fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-24-source-unit-precision-corrections
          path: research/v29_original_table_24_20261031/PRECISION_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 14
